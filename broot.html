<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ZENON FICTIONAL TEMPLE</title>
<link rel="icon" type="image/webp" href="favicon.webp">
<link rel="apple-touch-icon" href="favicon.png">

<style>

*{box-sizing:border-box}

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

/* THREE CANVAS */

canvas{
    display:block;
}

/* soft dark corners — a cheap, zero-asset way to make a WebGL scene read as "cinematic" */
.vignette{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:radial-gradient(120% 85% at 50% 45%, transparent 55%, rgba(0,0,0,.6) 100%);
}

/* TERMINAL */

#terminal{

    position:absolute;

    width:min(680px,90vw);
    height:102px;

    left:50%;
    bottom:calc(100px + env(safe-area-inset-bottom,0px));

    transform:translateX(-50%);

    background:rgba(0,0,0,0.82);

    border:3px solid rgb(237, 226, 10);

    border-radius:12px;

    box-shadow:0 0 20px rgb(237, 226, 10);

    overflow-y:auto;

    padding:20px;

    z-index:10;
}

/* SCROLLBAR */

#terminal::-webkit-scrollbar{

    width:8px;
}

#terminal::-webkit-scrollbar-thumb{

    background:rgb(237, 226, 10);
    border-radius:10px;
}

/* TERMINAL TEXT */

#terminalText{

    color:rgb(237, 226, 10);

    font-size:28px;

    line-height:42px;

    font-family:monospace;

    white-space:pre-wrap;
}

#backBtn{
    position:absolute;
    top:calc(20px + env(safe-area-inset-top,0px));
    left:20px;

    padding:12px 20px;

    background:rgb(237, 226, 10);
    color:black;

    border:none;
    border-radius:10px;

    font-weight:bold;
    cursor:pointer;

    z-index:20;
}

/* BUY BUTTON (kept from your original — unused unless you wire it up) */

#buyBtn{

    position:absolute;

    bottom:30px;

    left:55%;

    transform:translateX(-50%);

    width:min(320px,80vw);

    padding:18px;

    font-size:22px;

    font-weight:bold;

    border:none;

    border-radius:12px;

    background:rgb(237, 226, 10);

    color:white;

    cursor:pointer;

    z-index:20;

    display:none;

    box-shadow:0 0 25px rgb(237, 226, 10);
}

@media (prefers-reduced-motion:reduce){
    .vignette{display:none}
}

</style>

<script type="importmap">
{
  "imports": {
    "three":"https://unpkg.com/three@0.158.0/build/three.module.js"
  }
}
</script>

</head>

<body>

<div class="vignette" aria-hidden="true"></div>

<button id="backBtn">
← RETURN TO UNIVERSE
</button>

<!-- TERMINAL -->

<div id="terminal">

<div id="terminalText">
    ABOUT
</div>

</div>

<!-- BUY BUTTON -->



<script type="module">

import * as THREE from "three";

/* ================= SCENE ================= */

const scene = new THREE.Scene();

/* ================= CAMERA ================= */

const camera = new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,3,8);

/* ================= RENDERER ================= */

const renderer = new THREE.WebGLRenderer({
    antialias:false
});

renderer.setClearColor(0x000000,1);

/* filmic tone mapping is a free (no extra asset, no extra draw call) way to make the
   same lights + textures read as "cinematic" instead of flat/video-game-flat */
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(
renderer.domElement
);

/* ================= HTML ELEMENTS ================= */

const terminalText =
document.getElementById("terminalText");

/* ================= INPUT CAPABILITY ================= */

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fine = matchMedia("(hover:hover) and (pointer:fine)").matches && !reduceMotion;
const lowPower = window.innerWidth < 768;

/* ================= LOADER ================= */

const loader = new THREE.TextureLoader();

/* ================= CINEMATIC BACKDROP =================
   Your background image is no longer `scene.background` (a flat 2D wallpaper that never
   moves — the reason the scene read as "2D"). It is instead mapped onto a real plane
   sitting far behind the book. Because the camera gently drifts/parallaxes, this plane
   shifts on screen relative to the book and dust in front of it, which is what actually
   produces a 3D feeling of depth. It costs the same one image download as before. */

/* ================= CINEMATIC BACKDROP (dark + layered depth) ================= */

/* 1. near-black gradient, a tiny 2x256 canvas */
function makeGradientTexture(){

    const c = document.createElement("canvas");
    c.width = 2; c.height = 256;
    const g = c.getContext("2d");

    const gr = g.createLinearGradient(0,0,0,256);
    gr.addColorStop(0,    "#020306");
    gr.addColorStop(0.5,  "#070a10");
    gr.addColorStop(1,    "#0c0705");
    g.fillStyle = gr;
    g.fillRect(0,0,2,256);

    return new THREE.CanvasTexture(c);
}

const bgTexture = makeGradientTexture();
bgTexture.colorSpace = THREE.SRGBColorSpace;

const backdrop = new THREE.Mesh(
    new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({ map:bgTexture, fog:false, toneMapped:false })
);
const BACKDROP_Z = -34;
backdrop.position.z = BACKDROP_Z;
scene.add(backdrop);

scene.fog = new THREE.Fog(0x05070b, 14, 60);
renderer.setClearColor(0x05070b,1);

/* 2. haze layers at different depths: soft smoke that gives real parallax */

function hazeTexture(){

    const c = document.createElement("canvas");
    c.width = 128; c.height = 128;
    const g = c.getContext("2d");

    const r = g.createRadialGradient(64,64,0,64,64,64);
    r.addColorStop(0,   "rgba(255,255,255,1)");
    r.addColorStop(0.5, "rgba(255,255,255,.35)");
    r.addColorStop(1,   "rgba(255,255,255,0)");
    g.fillStyle = r;
    g.fillRect(0,0,128,128);

    return new THREE.CanvasTexture(c);
}

const hazeMap = hazeTexture();

/* [x, y, z, width, height, colour, opacity] */
const hazeLayers = [
    [ 1.1, 4.0, -7,  16,  9, 0xff8a30, 0.16],   /* warm glow right behind the book */
    [-4.0, 3.5, -12, 26, 12, 0x2a6a7a, 0.10],   /* cool teal smoke, mid-distance   */
    [ 5.0, 5.0, -18, 34, 14, 0x2a6a7a, 0.08],   /* cool teal smoke, far            */
    [ 0.0, 1.5, -10, 40,  5, 0x1a1a24, 0.30]    /* low dark mist near the floor    */
].map(([x,y,z,w,h,col,op])=>{

    const m = new THREE.Mesh(
        new THREE.PlaneGeometry(w,h),
        new THREE.MeshBasicMaterial({
            map:hazeMap,
            color:col,
            transparent:true,
            opacity:op,
            blending:THREE.AdditiveBlending,
            depthWrite:false,
            fog:false
        })
    );

    m.position.set(x,y,z);
    scene.add(m);

    return m;
});

/* fills the whole view at any screen size */
function sizeBackdrop(){

    const dist = camera.position.z - BACKDROP_Z;
    const vFov = camera.fov * Math.PI/180;

    const h = 2 * Math.tan(vFov/2) * dist * 1.3;
    const w = h * camera.aspect;

    backdrop.geometry.dispose();
    backdrop.geometry = new THREE.PlaneGeometry(w,h);
}
/* ================= LIGHTS ================= */

// ambient
const ambient = new THREE.AmbientLight(
0xffffff,
1.2
);

const sunLight = new THREE.DirectionalLight(
0xfff4cc,
2
);

sunLight.position.set(
5,
10,
5
);

scene.add(sunLight);

scene.add(ambient);

// cyan light
const cyanLight = new THREE.PointLight(
0xff3300,
2,
50
);

cyanLight.position.set(0,5,2);

scene.add(cyanLight);

// red alarm light


// under glow
const glowLight = new THREE.PointLight(
0xff3300,
3,
20
);

glowLight.position.set(0,2,-2);

scene.add(glowLight);

/* ================= BOOK ================= */

const book = new THREE.Group();

/* BOOK TEXTURE — this is still your real cover, untouched */

const coverTexture = loader.load(
"brootcover.webp",
undefined,
undefined,
(err)=>{
    console.warn("ZENON: could not load brootcover.webp — check it's in the same folder as broot.html and the name/case matches exactly", err);
    /* only tint the box gold if the real cover art actually failed to load —
       otherwise this never runs and the artwork shows at full, untinted colour */
    frontMaterial.color.set(0x2a2410);
    backMaterial.color.set(0x2a2410);
}
);

coverTexture.colorSpace =
THREE.SRGBColorSpace;

/* MATERIALS — upgraded to a physical material with a thin clearcoat, so the exact
   same cover art picks up a glossy printed-book highlight under the lights instead
   of the flat/matte look a MeshStandardMaterial gives a plain box */

const frontMaterial =
new THREE.MeshPhysicalMaterial({
    map:coverTexture,
    roughness:0.42,
    metalness:0.04,
    clearcoat:0.55,
    clearcoatRoughness:0.3
});

const backMaterial =
new THREE.MeshPhysicalMaterial({
    map:coverTexture,
    roughness:0.42,
    metalness:0.04,
    clearcoat:0.55,
    clearcoatRoughness:0.3
});

const materials = [

new THREE.MeshStandardMaterial({
    color:0x111111
}),

new THREE.MeshStandardMaterial({
    color:0x111111
}),

new THREE.MeshStandardMaterial({
    color:0x111111
}),

new THREE.MeshStandardMaterial({
    color:0x111111
}),

frontMaterial,

backMaterial

];

/* BOOK BODY */

const body = new THREE.Mesh(

new THREE.BoxGeometry(
1,
1.4,
0.2
),

materials

);

book.add(body);

/* PAGES */

const pages = new THREE.Mesh(

new THREE.BoxGeometry(
0.08,
1.28,
0.17
),

new THREE.MeshStandardMaterial({
    color:0xeaeaea
})

);

pages.position.x = 0.46;

book.add(pages);

/* RIM GLOW — a slightly larger, inside-out, additive copy of the book. Cheap (one
   extra box, no new texture) and reads as a soft gold neon edge-light, tying the
   book to the same gold used by the terminal and matching your site's look */

const outline = new THREE.Mesh(

new THREE.BoxGeometry(1.14, 1.54, 0.26),

new THREE.MeshBasicMaterial({
    color:0xffe27a,
    transparent:true,
    opacity:0.22,
    side:THREE.BackSide,
    blending:THREE.AdditiveBlending,
    depthWrite:false
})

);

book.add(outline);

scene.add(book);

/* ================= DUST MOTES =================
   Slow drifting specks between the camera and the book. A cheap, single draw call
   (one Points object) that gives the air in the scene real volume/depth. */

function dustSprite(){

    const c = document.createElement("canvas");
    c.width = 32; c.height = 32;

    const g = c.getContext("2d");
    const r = g.createRadialGradient(16,16,0,16,16,16);

    r.addColorStop(0,"rgba(255,244,200,1)");
    r.addColorStop(0.4,"rgba(255,220,140,.55)");
    r.addColorStop(1,"rgba(255,200,80,0)");

    g.fillStyle = r;
    g.fillRect(0,0,32,32);

    return new THREE.CanvasTexture(c);

}

const DUST_N = lowPower ? 55 : 110;

const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N*3);
const dustVel = new Float32Array(DUST_N);

for(let i=0;i<DUST_N;i++){

    dustPos[i*3]   = (Math.random()-0.5)*11;
    dustPos[i*3+1] = Math.random()*7 + 0.4;
    dustPos[i*3+2] = (Math.random()-0.5)*9 - 1;

    dustVel[i] = 0.15 + Math.random()*0.25;

}

dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos,3));

const dust = new THREE.Points(

dustGeo,

new THREE.PointsMaterial({
    map:dustSprite(),
    size:0.22,
    sizeAttenuation:true,
    transparent:true,
    opacity:0.55,
    depthWrite:false,
    blending:THREE.AdditiveBlending
})

);

scene.add(dust);

const shafts = [];

/* ================= GROUND GLOW =================
   A soft radial patch under the book standing in for a real-time shadow — far
   cheaper than enabling shadow maps, and it doubles as a "contact point" that
   grounds the book instead of it looking like it's pasted in front of the image. */

function glowTexture(){

    const c = document.createElement("canvas");
    c.width = 128; c.height = 128;

    const g = c.getContext("2d");
    const r = g.createRadialGradient(64,64,0,64,64,64);

    r.addColorStop(0,"rgba(255,225,120,.55)");
    r.addColorStop(0.6,"rgba(255,180,60,.18)");
    r.addColorStop(1,"rgba(255,180,60,0)");

    g.fillStyle = r;
    g.fillRect(0,0,128,128);

    return new THREE.CanvasTexture(c);

}

const groundGlow = new THREE.Mesh(

new THREE.PlaneGeometry(4.6,4.6),

new THREE.MeshBasicMaterial({
    map:glowTexture(),
    transparent:true,
    blending:THREE.AdditiveBlending,
    depthWrite:false
})

);

groundGlow.rotation.x = -Math.PI/2;
scene.add(groundGlow);

/* ================= LAYOUT (init + every resize) =================
   Your original mobile bug: the page had no viewport meta tag, so a phone rendered
   it as a shrunk-down desktop page (~980px wide) instead of its real width — that's
   why the book landed off in a corner. The tag added to <head> fixes that at the
   root. This function also now handles sizing everything in one place instead of
   being split across three separate blocks. */

let bookBaseY = 4;

function layout(){

    const w = window.innerWidth;
    const h = window.innerHeight;
    const mobile = w < 768;

    camera.fov = mobile ? 76 : 70;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();

    renderer.setSize(w,h);
    renderer.setPixelRatio(
        mobile
        ? Math.min(window.devicePixelRatio,1) * 0.8
        : Math.min(window.devicePixelRatio,1)
    );

    const s = mobile ? 4.3 : 5;

    book.scale.set(s,s,s);

    bookBaseY = mobile ? 4.2 : 4;
    book.position.set(mobile ? 0.4 : 1.1, bookBaseY, -3);

    sizeBackdrop();

}

window.addEventListener("resize", layout);

layout();

/* ================= TEXT ================= */

const fullText =

`What if you could skip the hardest phase of your life?

Broot is tired of pressure, failure, and the fear of everyone around him is moving forward, he feels left behind.
One evening , he walks into a silent temple and makes one wish.
The next time he opens his eyes...

Everything is changed.

But is the new life he wished for really the life he wanted?.

Broot And The Temple Wish is an emotional story about pressure, choices, dreams, and the journey that shapes who we become.

Sometimes, the life we want isn't the life we truly need..`;

/* ================= MODES ================= */

let mode = "lab";

let index = 0;

let display = "";

/* ================= AUDIO ================= */


/* ================= OPEN ABOUT ================= */
const typingSound = new Audio("typing.mp3");

const TYPE_POOL = 6;
const typePool = Array.from({length:TYPE_POOL}, ()=>{
    const a = new Audio("typing.mp3");
    a.preload = "auto";
    a.volume = 0.6;
    return a;
});
let typeIdx = 0;

function playTick(){
    const a = typePool[typeIdx];
    typeIdx = (typeIdx + 1) % TYPE_POOL;
    clearTimeout(a._t);
    a.currentTime = 0;
    a.play().catch(()=>{});
    a._t = setTimeout(()=>a.pause(), 70);
}

window.addEventListener(
"click",
()=>{

    if(mode === "lab"){

        mode = "about";

        display = "";

        index = 0;

        lastType = 0;

    }

}
);



/* ================= BUY BUTTON ================= */
document
.getElementById("backBtn")
.addEventListener("click",()=>{

    window.location.href =
    "index.html";

});

/* ================= CAMERA DRIFT / PARALLAX =================
   A perspective camera that gently rotates makes near things (the book, the dust)
   slide across the frame faster than the far backdrop — real parallax, which is
   the actual depth cue a static camera can never give you. Pointer parallax only
   runs on devices with a mouse; every device still gets the slow automatic sway. */

const camTarget = new THREE.Vector3(0.4, 3.6, -3);

let parX = 0, parY = 0, targetParX = 0, targetParY = 0;

if(fine){

    window.addEventListener("pointermove", (e)=>{

        targetParX = (e.clientX/window.innerWidth  - 0.5) * 1.1;
        targetParY = (e.clientY/window.innerHeight - 0.5) * 0.6;

    }, {passive:true});

}

/* ================= ANIMATE ================= */
let lastType = 0;
let t = 0;
let rafId = 0;

function animate(){

rafId = requestAnimationFrame(
animate
);

t += 0.02;

/* FLOAT — bookBaseY is the responsive resting height set by layout();
   this just adds the gentle bob on top of it each frame. */

const floatY = Math.sin(t * 0.4) * 0.12;

book.position.y = bookBaseY + floatY;

book.rotation.y += 0.001;

book.rotation.z =
Math.sin(t * 0.3) * 0.03;

glowLight.intensity =
3 + Math.sin(t * 0.5) * 0.3;

/* CAMERA DRIFT */

if(!reduceMotion){

    parX += (targetParX - parX) * 0.04;
    parY += (targetParY - parY) * 0.04;

    const drift = Math.sin(t * 0.15) * 0.35;

    camera.lookAt(
        camTarget.x + parX + drift,
        camTarget.y - parY,
        camTarget.z
    );

}

/* DUST DRIFT */

const dp = dust.geometry.attributes.position;

for(let i=0;i<DUST_N;i++){

    let y = dp.array[i*3+1] + dustVel[i]*0.016;

    if(y > 7.6) y = 0.4;

    dp.array[i*3+1] = y;
    dp.array[i*3]  += Math.sin(t*0.5 + i) * 0.0015;

}

dp.needsUpdate = true;

/* LIGHT SHAFT FLICKER */

shafts.forEach((m,i)=>{

    m.material.opacity = 0.35 + Math.sin(t*0.2 + i*2) * 0.12;

});

/* GROUND GLOW FOLLOWS THE BOOK */

groundGlow.position.set(
    book.position.x,
    book.position.y - 3.15,
    book.position.z + 0.4
);

/* MODES */

if(mode === "lab"){

    ambient.intensity = 1.2;

    cyanLight.intensity = 4;

    glowLight.intensity = 5;

    glowLight.color.set(0xff3300);


    frontMaterial.emissiveIntensity = 0;

    backMaterial.emissiveIntensity = 0;

    terminalText.innerText =
    "                    ABOUT             ";

}
else{

    ambient.intensity = 0.15;

    cyanLight.intensity = 0.4;

    glowLight.color.set(0xff3300);

    glowLight.intensity = 5;

    if(
        index < fullText.length &&
        Date.now() - lastType > 80
    ){

        const letter =
        fullText.charAt(index);

        display += letter;

        index++;

        terminalText.innerText =
        display;

        lastType = Date.now();

      if(
    letter !== " " &&
    letter !== "\n"
){

    typingSound.pause();
    typingSound.currentTime = 0;

    typingSound.play()
    .catch(()=>{});

}
{
    playTick();
}
    }

    if(index >= fullText.length){

    typingSound.pause();
    typingSound.currentTime = 0;

}

}


/* RENDER */

renderer.render(
scene,
camera
);


}

animate();

/* ================= VISIBILITY ================= */
/* Fixed from the original: it called renderer.setAnimationLoop(null) to pause,
   but the loop was being driven by requestAnimationFrame directly, not the
   renderer's internal scheduler — so that call never actually stopped anything,
   and returning to the tab could stack up extra concurrent loops over time.
   This now really cancels the frame and starts exactly one loop back up. */

document.addEventListener(
"visibilitychange",
()=>{
    if(document.hidden){
        cancelAnimationFrame(rafId);
    }
    else{
        animate();
    }
}
);

</script>

</body>
</html>
