<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040c">
<title>NOVAZONE ARCHIVE | ZENON Fictional Universe</title>
<meta name="description" content="The NOVAZONE archive: characters, ships, planets and armies of the ZENON fictional universe by K.G.ZENON.">
<meta name="author" content="K.G.ZENON">
<link rel="icon" type="image/webp" href="favicon.webp">
<link rel="apple-touch-icon" href="favicon.png">

<!-- same font as the main page, so it is already cached when visitors arrive from there -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#03040c;
  --a:#8fdcff;                  /* accent of the world you are viewing (set by JS) */
  --text:#e9f2ff;
  --muted:#8fa2c2;
  --display:'Orbitron','Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.16,.84,.24,1);
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);scroll-behavior:smooth}
body{
  color:var(--text);min-height:100vh;isolation:isolate;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body.lb-open{overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}

/* ───────── BACKGROUND: live stars + one soft colour glow per world ───────── */
#space{position:fixed;inset:0;width:100%;height:100%;z-index:-3;pointer-events:none}
.glows i{position:fixed;inset:0;z-index:-2;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
[data-world="all"] .g-all,[data-world="kirax"] .g-kirax,[data-world="vedtoria"] .g-vedtoria,
[data-world="warship"] .g-warship,[data-world="monster"] .g-monster,[data-world="beyond"] .g-beyond{opacity:1}
.g-all{background:radial-gradient(55% 40% at 18% 8%,rgba(90,130,255,.20),transparent 70%),radial-gradient(45% 40% at 88% 22%,rgba(150,90,255,.17),transparent 70%),radial-gradient(60% 45% at 50% 100%,rgba(0,190,255,.10),transparent 70%)}
.g-kirax{background:radial-gradient(60% 45% at 20% 10%,rgba(55,240,255,.21),transparent 70%),radial-gradient(50% 45% at 85% 30%,rgba(40,110,255,.16),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(0,150,255,.11),transparent 70%)}
.g-vedtoria{background:radial-gradient(60% 45% at 20% 10%,rgba(61,255,160,.19),transparent 70%),radial-gradient(50% 45% at 85% 30%,rgba(20,170,120,.16),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(160,255,110,.08),transparent 70%)}
.g-warship{background:radial-gradient(60% 45% at 20% 10%,rgba(255,77,94,.20),transparent 70%),radial-gradient(50% 45% at 85% 30%,rgba(255,120,40,.13),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(190,30,60,.12),transparent 70%)}
.g-monster{background:radial-gradient(60% 45% at 20% 10%,rgba(255,176,46,.20),transparent 70%),radial-gradient(50% 45% at 85% 30%,rgba(255,90,30,.14),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(200,110,0,.10),transparent 70%)}
.g-beyond{background:radial-gradient(60% 45% at 20% 10%,rgba(165,139,255,.21),transparent 70%),radial-gradient(50% 45% at 85% 30%,rgba(90,60,220,.16),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(120,80,255,.11),transparent 70%)}
.vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,8,.72) 100%)}

/* deep-space depth: a Milky-Way band tinted by the current world, and the world's horizon below you */
.band{position:fixed;inset:0;width:100%;height:100%;z-index:-4;pointer-events:none;opacity:0;transform:scale(1.06);transition:opacity 1.3s ease}
.band.on{opacity:1}
.horizon{
  position:fixed;left:-28vw;right:-28vw;bottom:0;height:14vh;z-index:-1;pointer-events:none;
  border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(180deg,rgba(2,3,10,.97),#010207);
  box-shadow:0 -2px 3px rgba(255,255,255,.6),0 -8px 26px rgba(143,220,255,.5),0 -40px 110px rgba(143,220,255,.28);
  box-shadow:0 -2px 3px color-mix(in srgb,var(--a) 80%,#fff),0 -8px 26px color-mix(in srgb,var(--a) 62%,transparent),0 -40px 110px color-mix(in srgb,var(--a) 34%,transparent);
  transition:box-shadow .9s ease;
}
.horizon::after{                                   /* the star rising over the limb */
  content:"";position:absolute;top:-16px;left:68%;width:min(36vw,440px);height:46px;transform:translateX(-50%);opacity:.85;
  background:radial-gradient(closest-side,rgba(255,255,255,.8),rgba(255,255,255,.2) 45%,transparent);
  background:radial-gradient(closest-side,rgba(255,255,255,.8),color-mix(in srgb,var(--a) 45%,transparent) 42%,transparent);
}

/* ───────── TOP BAR (stays on screen: back button + world selector) ───────── */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:linear-gradient(rgba(3,4,12,.96),rgba(3,4,12,.84));
}
.back-btn{
  flex:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 15px;border-radius:999px;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#eaf6ff;text-decoration:none;
  font:700 .66rem/1 var(--display);letter-spacing:.12em;transition:border-color .25s,background .25s;
}
.back-btn:hover{border-color:var(--a);background:rgba(255,255,255,.1)}
.worlds{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 2px 2px 0}
.worlds::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#cfdcf2;
  font:700 .64rem/1 var(--display);letter-spacing:.1em;white-space:nowrap;
  transition:border-color .25s,background .25s,box-shadow .25s,color .25s;-webkit-tap-highlight-color:transparent;
}
.chip:hover{border-color:var(--c,#fff)}
.chip .orb{                                   /* every world is a tiny planet */
  width:12px;height:12px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff,var(--c) 42%,#000 135%);box-shadow:0 0 10px var(--c);
}
.chip em{font-style:normal;font-weight:400;opacity:.6}
.chip[aria-pressed="true"]{
  color:#fff;border-color:var(--c);background:rgba(255,255,255,.1);
  background:color-mix(in srgb,var(--c) 17%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 32%,transparent);
}

/* ───────── HEADER ───────── */
.hero{position:relative;text-align:center;padding:26px 18px 6px;overflow:hidden}
.orbits{                                       /* slow holographic orbits behind the title */
  position:absolute;left:50%;top:52%;width:min(92vw,620px);aspect-ratio:1;transform:translate(-50%,-50%);
  perspective:800px;pointer-events:none;opacity:.7;
}
.ring{position:absolute;border-radius:50%;border:1px solid var(--a);transition:border-color .8s}
.ring::before{
  content:"";position:absolute;top:-4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
  background:var(--a);box-shadow:0 0 12px var(--a),0 0 26px var(--a);transition:background .8s,box-shadow .8s;
}
.r1{inset:0;opacity:.24;transform:rotateX(74deg);animation:orbA 42s linear infinite}
.r2{inset:13%;opacity:.32;transform:rotateX(66deg) rotateY(20deg);animation:orbB 28s linear infinite reverse}
.r3{inset:30%;opacity:.4;transform:rotateX(78deg);animation:orbA 19s linear infinite}
@keyframes orbA{to{transform:rotateX(74deg) rotateZ(360deg)}}
@keyframes orbB{to{transform:rotateX(66deg) rotateY(20deg) rotateZ(360deg)}}
.orbits.paused .ring{animation-play-state:paused}
.logo{position:relative;display:block;width:56px;height:56px;margin:0 auto 12px;border-radius:50%;box-shadow:0 0 30px rgba(255,190,90,.25)}
h1{
  position:relative;font:900 clamp(1.9rem,6.4vw,3.6rem)/1.05 var(--display);letter-spacing:.06em;
  background:linear-gradient(180deg,#fff 25%,var(--a) 140%);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{position:relative;max-width:560px;margin:12px auto 0;color:var(--muted);font-size:.98rem;line-height:1.6}
.notice{
  position:relative;max-width:640px;margin:18px auto 0;padding:10px 14px;border-radius:10px;
  border:1px solid rgba(255,255,255,.16);background:rgba(3,4,12,.55);color:#b9c8e2;font-size:.82rem;line-height:1.5;
}

/* ───────── TOOLS ───────── */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;max-width:1500px;margin:22px auto 0;padding:0 18px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:999px;overflow:hidden}
.seg button{
  min-height:38px;padding:0 16px;border:0;background:transparent;cursor:pointer;color:#cfdcf2;
  font:700 .64rem/1 var(--display);letter-spacing:.12em;transition:background .25s,color .25s;
}
.seg button:hover{background:rgba(255,255,255,.08)}
.seg button[aria-pressed="true"]{background:var(--a);color:#03040c}
.search{
  display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:999px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:var(--muted);
}
.search:focus-within{border-color:var(--a)}
.search input{width:min(52vw,220px);border:0;outline:0;background:transparent;font-size:.9rem;color:var(--text)}
.search input::placeholder{color:#6f83a6}
.banner{
  display:flex;justify-content:space-between;gap:12px;max-width:1500px;margin:22px auto 14px;padding:0 20px;
  font:400 .68rem/1.4 var(--display);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;
}
.banner b{color:var(--a);font-weight:700;transition:color .8s}

/* ───────── GRID + CARDS ───────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:1500px;margin:0 auto;padding:4px 18px 80px}
.card{
  position:relative;aspect-ratio:3/4.1;perspective:900px;outline:none;-webkit-tap-highlight-color:transparent;
  animation:scanIn .5s var(--ease) calc(var(--i,0)*24ms) backwards;      /* only plays when the list changes */
}
@keyframes scanIn{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.tilt{
  position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out;
}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s var(--ease)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:14px;overflow:hidden;background:#070a18;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid rgba(255,255,255,.14);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
  box-shadow:0 10px 28px rgba(0,0,0,.5);transition:box-shadow .35s;
}
@media (hover:hover){.card:hover .face{box-shadow:0 12px 32px rgba(0,0,0,.55),0 0 26px color-mix(in srgb,var(--c) 38%,transparent)}}
.card:focus-visible .face{outline:2px solid var(--c);outline-offset:3px}

.art{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;
  transition:transform .9s var(--ease);user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;
}
@media (hover:hover){.card:hover .art{transform:scale(1.05)}}
.front::after{content:"";position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(transparent,rgba(3,4,14,.95));pointer-events:none}
.front::before{                                /* HUD corner brackets in the world's colour */
  content:"";position:absolute;inset:8px;z-index:3;pointer-events:none;opacity:.55;transition:opacity .3s,transform .4s var(--ease);
  background:
    linear-gradient(var(--c),var(--c)) 0 0/14px 2px,linear-gradient(var(--c),var(--c)) 0 0/2px 14px,
    linear-gradient(var(--c),var(--c)) 100% 0/14px 2px,linear-gradient(var(--c),var(--c)) 100% 0/2px 14px,
    linear-gradient(var(--c),var(--c)) 0 100%/14px 2px,linear-gradient(var(--c),var(--c)) 0 100%/2px 14px,
    linear-gradient(var(--c),var(--c)) 100% 100%/14px 2px,linear-gradient(var(--c),var(--c)) 100% 100%/2px 14px;
  background-repeat:no-repeat;
}
@media (hover:hover){.card:hover .front::before{opacity:1;transform:scale(1.035)}}
.cap{position:absolute;left:15px;right:15px;bottom:15px;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.cap h3{font:700 .86rem/1.3 var(--display);letter-spacing:.04em;color:#fff}
.cap span{display:block;margin-top:6px;font:400 .58rem/1 var(--display);letter-spacing:.2em;color:var(--c);text-transform:uppercase}
.zoom,.nav{
  position:absolute;z-index:4;display:grid;place-items:center;border:0;cursor:pointer;color:#eaffff;
  background:rgba(3,4,14,.62);transition:background .25s,color .25s,opacity .25s;-webkit-tap-highlight-color:transparent;
}
.zoom{top:17px;right:17px;width:30px;height:30px;border-radius:50%}
.nav{top:50%;width:28px;height:44px;margin-top:-22px;border-radius:8px;font-size:22px;line-height:1}
.nav.prev{left:8px}.nav.next{right:8px}
.zoom:hover,.nav:hover{background:var(--c);color:#03040c}
.count{
  position:absolute;z-index:4;top:14px;left:14px;padding:5px 9px;border-radius:999px;background:rgba(3,4,14,.62);
  font:400 .58rem/1 var(--display);letter-spacing:.12em;color:var(--c);
}
@media (hover:hover){.nav{opacity:0}.card:hover .nav,.nav:focus-visible{opacity:1}}

.back{
  transform:rotateY(180deg);padding:18px 16px 14px;display:flex;flex-direction:column;gap:12px;overflow:auto;scrollbar-width:thin;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
    linear-gradient(160deg,rgba(13,18,42,.99),rgba(4,6,18,.99));
}
.back .file{font:400 .56rem/1 var(--display);letter-spacing:.22em;color:var(--c);text-transform:uppercase}
.back h4{font:700 .95rem/1.3 var(--display);letter-spacing:.03em;color:#fff}
.row{font-size:.82rem;line-height:1.5;color:#dfe8f7}
.row b{display:block;margin-bottom:6px;font:400 .54rem/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:#7f92b3}
.chips{display:flex;flex-wrap:wrap;gap:5px;list-style:none}
.chips li{
  padding:4px 9px;border-radius:999px;font-size:.7rem;line-height:1.3;color:#eaf6ff;
  border:1px solid rgba(255,255,255,.2);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:rgba(255,255,255,.05);background:color-mix(in srgb,var(--c) 10%,transparent);
}
.hint{margin-top:auto;padding-top:6px;font:400 .52rem/1 var(--display);letter-spacing:.2em;color:#5f7090;text-transform:uppercase}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--muted);font:400 .8rem/1.6 var(--display);letter-spacing:.14em}

/* ───────── CHAPTER CARD (plays when you enter another world) ───────── */
.chapter{
  position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;background:radial-gradient(60% 38% at 50% 50%,rgba(2,3,10,.78),transparent 78%);
}
.chapter.go{display:flex;animation:chBg 1.9s ease both}
.chapter h2{font:900 clamp(1.8rem,7.4vw,4.2rem)/1 var(--display);color:#fff;letter-spacing:.14em;padding-left:.14em;text-shadow:0 0 34px var(--a),0 0 8px var(--a)}
.chapter .chline{width:min(62vw,440px);height:2px;margin:18px 0 14px;background:linear-gradient(90deg,transparent,var(--a),#fff,var(--a),transparent);box-shadow:0 0 18px var(--a);transform:scaleX(0)}
.chapter p{font:400 .72rem/1.4 var(--display);letter-spacing:.3em;padding-left:.3em;color:#d6ebff;text-transform:uppercase}
.chapter.go h2{animation:chTrack 1.9s cubic-bezier(.2,.7,.2,1) both}
.chapter.go .chline{animation:chLine 1.9s ease both}
@keyframes chBg{0%{opacity:0}18%{opacity:1}72%{opacity:1}100%{opacity:0}}
@keyframes chTrack{0%{opacity:0;letter-spacing:.55em;transform:scale(1.07)}26%{opacity:1}72%{opacity:1}100%{opacity:0;letter-spacing:.2em;transform:none}}
@keyframes chLine{0%{transform:scaleX(0)}32%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.chapter{display:none!important}}

/* ───────── IMAGE VIEWER ───────── */
.lb{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(2,3,10,.95);animation:lbIn .22s ease}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lb figure{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:92vw}
.lb img{
  max-width:92vw;max-height:80vh;object-fit:contain;border-radius:10px;
  border:1px solid rgba(255,255,255,.3);border:1px solid color-mix(in srgb,var(--a) 60%,transparent);
  box-shadow:0 0 44px color-mix(in srgb,var(--a) 25%,transparent);
}
.lb figcaption{font:400 .7rem/1.4 var(--display);letter-spacing:.16em;color:#cfe3f5;text-align:center}
.lb-btn,.lb-close{
  position:absolute;z-index:2;border:0;cursor:pointer;color:#eaffff;background:rgba(3,4,14,.7);
  transition:background .25s,color .25s;-webkit-tap-highlight-color:transparent;
}
.lb-btn{top:50%;width:48px;height:64px;margin-top:-32px;border-radius:10px;font-size:34px;line-height:1}
.lb-btn.prev{left:16px}.lb-btn.next{right:16px}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 16px);right:18px;width:44px;height:44px;border-radius:50%;font-size:28px;line-height:1}
.lb-btn:hover,.lb-close:hover{background:var(--a);color:#03040c}

/* ───────── RESPONSIVE ───────── */
@media (max-width:640px){
  .back-btn .lbl{display:none}
  .back-btn{padding:0 13px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 10px 60px}
  .cap{left:11px;right:11px;bottom:11px}.cap h3{font-size:.74rem}
  .back{padding:13px 11px 9px;gap:7px}.back h4{font-size:.8rem}.row{font-size:.72rem;line-height:1.4}.row b{margin-bottom:4px}.chips{gap:4px}.chips li{font-size:.6rem;padding:3px 7px}
  .banner{font-size:.6rem}#bNote,.sep{display:none}
  .zoom{top:14px;right:14px}
  .lb-btn{width:40px;height:54px;margin-top:-27px;font-size:28px}.lb-btn.prev{left:8px}.lb-btn.next{right:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>

<body data-world="all">

<canvas id="band" class="band" aria-hidden="true"></canvas><canvas id="band2" class="band" aria-hidden="true"></canvas>
<canvas id="space" aria-hidden="true"></canvas>
<div class="glows" aria-hidden="true"><i class="g-all"></i><i class="g-kirax"></i><i class="g-vedtoria"></i><i class="g-warship"></i><i class="g-monster"></i><i class="g-beyond"></i></div>
<div class="vig" aria-hidden="true"></div>
<div class="horizon" aria-hidden="true"></div>

<nav class="topbar" aria-label="Archive navigation">
  <a class="back-btn" id="backBtn" href="index.html" aria-label="Return to the universe"><span aria-hidden="true">←</span><span class="lbl">RETURN TO UNIVERSE</span></a>
  <div class="worlds" id="worlds" role="group" aria-label="Choose a world"></div>
</nav>

<header class="hero">
  <div class="orbits paused" id="orbits" aria-hidden="true"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i></div>
  <img class="logo" src="logo.webp" width="56" height="56" alt="K.G.Z">
  <h1>NOVAZONE ARCHIVE</h1>
  <p class="sub">Characters, ships, armies and worlds from the cosmic universe of K.G.ZENON.</p>
  <p class="notice">⚠ Images shown are AI-generated visuals created to represent the characters, ships, and environments.</p>
</header>

<div class="tools">
  <div class="seg" id="types" role="group" aria-label="Filter by type">
    <button type="button" data-t="all" aria-pressed="true">ALL</button>
    <button type="button" data-t="characters" aria-pressed="false">CHARACTERS</button>
    <button type="button" data-t="other" aria-pressed="false">OTHER</button>
  </div>
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search the archive…" autocomplete="off" aria-label="Search the archive">
  </label>
</div>

/* ═══════════════════════ WORLDS (colour-coding of the universe) ═══════════════════════ */
const WORLDS = {
  all:      { label:'ALL WORLDS',   note:'Every file in the archive',            color:'#8fdcff' },
  kirax:    { label:'KIRAX 17',     note:'Highly advanced planet',               color:'#37f0ff' },
  vedtoria: { label:'VEDTORIA',     note:'Nature and magical planet',            color:'#3dffa0' },
  warship:  { label:'WARSHIP',      note:"Zetorex's army carrier",               color:'#ff4d5e' },
  monster:  { label:'MONSTER ZONE', note:'Ancient monster region',               color:'#ffb02e' },
  beyond:   { label:'BEYOND',       note:'Earth, the Stellar Rift and deep space', color:'#a58bff' }
};
function worldOf(it){
  if(it.world && WORLDS[it.world]) return it.world;
  const z = (it.zone || '').toLowerCase(), n = it.name.toLowerCase();
  if(z.includes('monster') || n.includes('monster')) return 'monster';
  if(z.includes('vedtoria') || n.startsWith('vedtoria')) return 'vedtoria';
  if(z.includes('kirax') || n.startsWith('kirax')) return 'kirax';
  if(z.includes('warship') || z === 'space') return 'warship';
  return 'beyond';
}

/* ═══════════════════════ HELPERS ═══════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine = matchMedia('(hover:hover) and (pointer:fine)').matches && !reduce;

novazone.forEach(it => { it._w = worldOf(it); it._imgs = it.images || [it.img]; it._cur = 0; });

const grid = $('#grid'), worldsEl = $('#worlds'), typesEl = $('#types');
const state = { world:'all', type:'all', q:'' };
let view = [];
let fxWorld = 'all', booted = false, fxSetWorld = () => {};
const chapterEl = $('#chapter');
function showChapter(W){
  if(reduce) return;
  $('#chName').textContent = W.label; $('#chNote').textContent = W.note;
  chapterEl.classList.remove('go'); void chapterEl.offsetWidth; chapterEl.classList.add('go');
}
chapterEl.addEventListener('animationend', e => { if(e.target === chapterEl) chapterEl.classList.remove('go'); });

/* world chips (only worlds that actually have files) */
const counts = { all: novazone.length };
novazone.forEach(it => counts[it._w] = (counts[it._w] || 0) + 1);
worldsEl.innerHTML = Object.keys(WORLDS).filter(k => counts[k]).map(k =>
  `<button type="button" class="chip" data-w="${k}" style="--c:${WORLDS[k].color}" aria-pressed="false"><i class="orb"></i>${WORLDS[k].label}<em>${counts[k]}</em></button>`
).join('');

/* ═══════════════════════ RENDER ═══════════════════════ */
function cardHTML(it, i){
  const W = WORLDS[it._w], n = it._imgs.length;
  const chips = (it.power || '').split(',').map(s => s.trim()).filter(Boolean).map(s => `<li>${esc(cap(s))}</li>`).join('');
  return `
  <article class="card" data-i="${i}" tabindex="0" style="--c:${W.color};--i:${Math.min(i, 18)}" aria-label="${esc(it.name)}. Press Enter to read the file.">
    <div class="tilt"><div class="inner">
      <div class="face front">
        <img class="art" src="${esc(it._imgs[it._cur])}" alt="${esc(it.name)}" ${i < 6 ? '' : 'loading="lazy" '}decoding="async" draggable="false">
        <button type="button" class="zoom" aria-label="View larger image"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        ${n > 1 ? `<button type="button" class="nav prev" aria-label="Previous image">‹</button><button type="button" class="nav next" aria-label="Next image">›</button><span class="count">${it._cur + 1} / ${n}</span>` : ''}
        <div class="cap"><h3>${esc(it.name)}</h3><span>${W.label}</span></div>
      </div>
      <div class="face back">
        <div class="file">File · ${W.label}</div>
        <h4>${esc(it.name)}</h4>
        ${it.role ? `<div class="row"><b>Role</b>${esc(cap(it.role))}</div>` : ''}
        ${chips ? `<div class="row"><b>Abilities</b><ul class="chips">${chips}</ul></div>` : ''}
        ${it.zone ? `<div class="row"><b>Zone</b>${esc(cap(it.zone))}</div>` : ''}
        <span class="hint">Tap to flip back</span>
      </div>
    </div></div>
  </article>`;
}

function render(){
  grid.innerHTML = view.length ? view.map(cardHTML).join('') : '<p class="empty">NO FILES MATCH YOUR SEARCH</p>';
}

function updateUI(){
  const W = WORLDS[state.world];
  document.body.dataset.world = state.world;
  document.body.style.setProperty('--a', W.color);
  worldsEl.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.w === state.world));
  typesEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === state.type));
  $('#bName').textContent = W.label;
  $('#bNote').textContent = W.note;
  $('#bCount').textContent = view.length + (view.length === 1 ? ' file' : ' files');
}

function apply(){
  const q = state.q.trim().toLowerCase();
  view = novazone.filter(it =>
    (state.world === 'all' || it._w === state.world) &&
    (state.type === 'all' || it.type === state.type) &&
    (!q || (it.name + ' ' + (it.role || '') + ' ' + (it.power || '') + ' ' + (it.zone || '')).toLowerCase().includes(q)));
  render(); updateUI();
  if(state.world !== fxWorld){                                   // entering another world: change the scene + play the chapter card
    fxWorld = state.world; fxSetWorld(fxWorld);
    if(booted) showChapter(WORLDS[fxWorld]);
  }
  booted = true;
}

worldsEl.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  state.world = c.dataset.w; apply();
  c.scrollIntoView({ inline:'center', block:'nearest', behavior: reduce ? 'auto' : 'smooth' });
});
typesEl.addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; state.type = b.dataset.t; apply(); });
let qT = 0;
$('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value; apply(); }, 120); });

/* ═══════════════════════ CARD INTERACTION ═══════════════════════
   click a card = flip (file ↔ picture)   ·   ⤢ button, double-click or long-press = zoom   ·   ‹ › = more pictures */
let flipT = 0, suppress = false;
const itemOf = el => view[+el.closest('.card').dataset.i];
const flip = card => card.classList.toggle('flipped');

function step(card, it, d){
  const n = it._imgs.length;
  it._cur = (it._cur + d + n) % n;
  card.querySelector('.art').src = it._imgs[it._cur];
  card.querySelector('.count').textContent = (it._cur + 1) + ' / ' + n;
  new Image().src = it._imgs[(it._cur + 1) % n];               // warm up the next picture
}

grid.addEventListener('click', e => {
  const card = e.target.closest('.card'); if(!card) return;
  const it = itemOf(card);
  const nav = e.target.closest('.nav');
  if(nav){ step(card, it, nav.classList.contains('next') ? 1 : -1); return; }
  if(e.target.closest('.zoom')){ openZoom(it); return; }
  if(suppress) return;
  clearTimeout(flipT);
  if(fine && e.target.classList.contains('art')) flipT = setTimeout(() => flip(card), 230);   // leave room for a double-click
  else flip(card);
});
grid.addEventListener('dblclick', e => {
  if(!e.target.classList.contains('art')) return;
  clearTimeout(flipT); openZoom(itemOf(e.target));
});
grid.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')){ e.preventDefault(); flip(e.target); }
});

/* long-press on a picture (touch) opens the viewer */
let holdT = 0, hx = 0, hy = 0, touchNow = false;
grid.addEventListener('pointerdown', e => {
  touchNow = e.pointerType === 'touch';
  if(!touchNow || !e.target.classList.contains('art')) return;
  hx = e.clientX; hy = e.clientY;
  const it = itemOf(e.target);
  clearTimeout(holdT);
  holdT = setTimeout(() => { suppress = true; openZoom(it); setTimeout(() => suppress = false, 600); }, 550);
});
['pointerup', 'pointercancel'].forEach(t => grid.addEventListener(t, () => clearTimeout(holdT)));
grid.addEventListener('contextmenu', e => { if(touchNow && e.target.classList.contains('art')) e.preventDefault(); });

/* subtle 3D tilt that follows the pointer (desktop only, one card at a time) */
if(fine){
  let raf = 0, ev = null, cur = null;
  const tiltOf = c => c.firstElementChild;
  const reset = c => { const t = tiltOf(c); t.style.setProperty('--rx', '0deg'); t.style.setProperty('--ry', '0deg'); };
  grid.addEventListener('pointermove', e => {
    if(e.pointerType !== 'mouse') return;
    ev = e;
    if(raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const card = ev.target.closest && ev.target.closest('.card');
      if(cur && cur !== card) reset(cur);
      cur = card; if(!card) return;
      const r = card.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height, t = tiltOf(card);
      t.style.setProperty('--rx', ((0.5 - y) * 9).toFixed(2) + 'deg');
      t.style.setProperty('--ry', ((x - 0.5) * 11).toFixed(2) + 'deg');
    });
  });
  grid.addEventListener('pointerleave', () => { if(cur){ reset(cur); cur = null; } });
}

/* ═══════════════════════ IMAGE VIEWER ═══════════════════════ */
const lb = $('#lb'), lbImg = $('#lbImg'), lbCap = $('#lbCap'), lbPrev = $('#lbPrev'), lbNext = $('#lbNext');
let lbList = [], lbI = 0, lbName = '', lbAt = 0, lbBack = null, lbOpen = false;

function lbShow(){
  lbImg.src = lbList[lbI]; lbImg.alt = lbName;
  lbCap.textContent = lbName + (lbList.length > 1 ? '  ·  ' + (lbI + 1) + ' / ' + lbList.length : '');
  const multi = lbList.length > 1;
  lbPrev.hidden = lbNext.hidden = !multi;
  if(multi){ new Image().src = lbList[(lbI + 1) % lbList.length]; new Image().src = lbList[(lbI - 1 + lbList.length) % lbList.length]; }
}
function openZoom(it){
  lbList = it._imgs; lbI = it._cur || 0; lbName = it.name; lbAt = performance.now(); lbBack = document.activeElement;
  lbShow(); lb.hidden = false; lbOpen = true; document.body.classList.add('lb-open'); $('#lbClose').focus({ preventScroll:true });
}
function lbStep(d){ lbI = (lbI + d + lbList.length) % lbList.length; lbShow(); }
function closeZoom(){
  lb.hidden = true; lbOpen = false; document.body.classList.remove('lb-open'); lbImg.removeAttribute('src');
  if(lbBack && lbBack.focus) lbBack.focus({ preventScroll:true });
}
lb.addEventListener('click', e => {
  if(performance.now() - lbAt < 450) return;                    // ignore the tap that opened it
  if(e.target.closest('#lbPrev')) return lbStep(-1);
  if(e.target.closest('#lbNext')) return lbStep(1);
  if(e.target.closest('#lbImg')) return;
  closeZoom();
});
document.addEventListener('keydown', e => {
  if(!lbOpen) return;
  if(e.key === 'Escape') closeZoom();
  else if(e.key === 'ArrowLeft' && lbList.length > 1) lbStep(-1);
  else if(e.key === 'ArrowRight' && lbList.length > 1) lbStep(1);
});
let sx = 0, sy = 0;
lb.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
lb.addEventListener('pointerup', e => {
  if(e.pointerType !== 'touch' || lbList.length < 2) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if(Math.abs(dx) > 50 && Math.abs(dy) < 80) lbStep(dx < 0 ? 1 : -1);
});

/* ═══════════════════════ HEADER ORBITS: only animate while visible ═══════════════════════ */
if('IntersectionObserver' in window){
  const orb = $('#orbits');
  new IntersectionObserver(en => orb.classList.toggle('paused', !en[0].isIntersecting)).observe(orb);
} else $('#orbits').classList.remove('paused');

/* ═══════════════════════ DEEP-SPACE ENGINE ═══════════════════════
   One light canvas: stars + tiny galaxies + dust, and an ambience that changes with the world you enter
   (data-rain over Kirax, fireflies over Vedtoria, sparks + scanner beam on the Warship, embers in the Monster Zone,
   comets in deep space). Painted sprites are reused, so it stays cheap. */
(function(){
  const cv = $('#space'), ctx = cv.getContext('2d'), bands = [$('#band'), $('#band2')];
  const small = matchMedia('(max-width:768px)').matches, conn = navigator.connection || {};
  const lite = !!conn.saveData || /(^|-)2g$/.test(conn.effectiveType || '');
  const N = lite ? 45 : (small ? 80 : 140);
  let W = 0, H = 0, dpr = 1, raf = 0, last = 0, px = 0, py = 0, tx = 0, ty = 0;
  let world = 'all', amb = 0, parts = [], comet = null, nextComet = 0, bandOn = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const stars = Array.from({ length:N }, () => ({ x:Math.random(), y:Math.random(), z:0.15 + Math.random() * 0.85, tw:Math.random() * 6.28, warm:Math.random() < 0.14 }));

  /* ---- noise (for the Milky-Way band) ---- */
  const h3 = (x, y, z) => { let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
  function n3(x, y, z){
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    const a = h3(xi, yi, zi) + (h3(xi + 1, yi, zi) - h3(xi, yi, zi)) * u, b = h3(xi, yi + 1, zi) + (h3(xi + 1, yi + 1, zi) - h3(xi, yi + 1, zi)) * u;
    const c = h3(xi, yi, zi + 1) + (h3(xi + 1, yi, zi + 1) - h3(xi, yi, zi + 1)) * u, d = h3(xi, yi + 1, zi + 1) + (h3(xi + 1, yi + 1, zi + 1) - h3(xi, yi + 1, zi + 1)) * u;
    const e = a + (b - a) * v, f = c + (d - c) * v; return e + (f - e) * w;
  }
  const fbm = (x, y, z, o) => { let s = 0, a = 0.5; for(let i = 0; i < o; i++){ s += a * n3(x, y, z); x *= 2; y *= 2; z *= 2; a *= 0.5; } return s / (1 - Math.pow(0.5, o)); };

  function paintBand(cvs, rgb){                                   // painted once per world, tiny + smoothly stretched by the browser
    const asp = innerWidth / innerHeight, portrait = innerHeight > innerWidth;
    const th = portrait ? -0.95 : -0.42, v0 = portrait ? 0.08 : 0.16, sg = portrait ? 0.10 : 0.13;
    const RW = Math.max(48, Math.round(innerWidth / 6)), RH = Math.max(48, Math.round(innerHeight / 6));
    cvs.width = RW; cvs.height = RH;
    const g = cvs.getContext('2d'), im = g.createImageData(RW, RH), q = im.data, c = Math.cos(th), s = Math.sin(th), sd = rnd(0, 100);
    for(let y = 0; y < RH; y++) for(let x = 0; x < RW; x++){
      const xn = (x / RW - 0.5) * asp, yn = y / RH - 0.5 - v0, u = xn * c + yn * s, v = -xn * s + yn * c;
      const prof = Math.exp(-(v * v) / (2 * sg * sg)); if(prof < 0.01) continue;
      const along = 0.55 + 0.45 * Math.exp(-(u * u) / 0.18);
      let dens = prof * along * (0.25 + 1.5 * fbm(u * 3 + sd, v * 6, sd * 0.3, 4));
      const lane = Math.exp(-((v - 0.015) * (v - 0.015)) / 0.0008) * (0.4 + fbm(u * 9 + sd, v * 20, 3, 3));
      dens *= Math.max(0, 1 - lane * 0.85);
      let w = Math.min(1, along * prof * 1.2); w *= w;
      const o = (y * RW + x) * 4;
      q[o] = rgb[0] * 0.85 + (255 - rgb[0] * 0.85) * w * 0.8; q[o + 1] = rgb[1] * 0.85 + (215 - rgb[1] * 0.85) * w * 0.7; q[o + 2] = rgb[2] * 0.85 + (160 - rgb[2] * 0.85) * w * 0.7;
      q[o + 3] = Math.min(255, dens * 0.22 * 255);
    }
    g.putImageData(im, 0, 0);
  }
  const hexRGB = hex => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];

  /* ---- sprites (painted once) ---- */
  const glow = rgb => {
    const s = mk(48, 48), g = s.getContext('2d'), r = g.createRadialGradient(24, 24, 0, 24, 24, 24);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.12, 'rgba(' + rgb + ',.95)'); r.addColorStop(0.4, 'rgba(' + rgb + ',.25)'); r.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = r; g.fillRect(0, 0, 48, 48); return s;
  };
  const GL = { green:glow('90,255,170'), orange:glow('255,150,60') };
  const smudgeSprite = () => {                                   // tiny far-away galaxy
    const s = mk(64, 64), g = s.getContext('2d'), warm = Math.random() < 0.5;
    g.translate(32, 32); g.rotate(rnd(0, 3.14)); g.scale(1, rnd(0.28, 0.6));
    const r = g.createRadialGradient(0, 0, 0, 0, 0, 30);
    r.addColorStop(0, 'rgba(255,244,225,.95)'); r.addColorStop(0.12, 'rgba(255,226,190,.55)'); r.addColorStop(0.45, warm ? 'rgba(230,190,255,.16)' : 'rgba(170,200,255,.16)'); r.addColorStop(1, 'rgba(150,150,255,0)');
    g.fillStyle = r; g.beginPath(); g.arc(0, 0, 30, 0, 6.2832); g.fill(); return s;
  };
  let smudges = [], motes = [], MSPR = [];
  function buildProps(){
    smudges = []; motes = [];
    if(lite) return;
    for(let i = 0, n = small ? 3 : 5; i < n; i++) smudges.push({ x:rnd(0.05, 0.95), y:rnd(0.06, 0.94), w:rnd(16, 34) * dpr, spr:smudgeSprite(), d:rnd(0.002, 0.006) });
    MSPR = ['150,175,255', '255,196,150'].map(c => {
      const s = mk(96, 96), g = s.getContext('2d'), r = g.createRadialGradient(48, 48, 0, 48, 48, 48);
      r.addColorStop(0, 'rgba(' + c + ',.55)'); r.addColorStop(0.72, 'rgba(' + c + ',.7)'); r.addColorStop(0.9, 'rgba(' + c + ',1)'); r.addColorStop(1, 'rgba(' + c + ',0)');
      g.fillStyle = r; g.fillRect(0, 0, 96, 96); return s;
    });
    for(let i = 0, n = small ? 3 : 6; i < n; i++) motes.push({ x:rnd(0, 1), y:rnd(0, 1), vx:rnd(-0.006, 0.006), vy:rnd(-0.004, 0.004), r:rnd(18, 54) * dpr, a:rnd(0.03, 0.07), d:rnd(0.03, 0.09), c:i % 2 });
  }

  /* ---- world ambience ---- */
  function spawn(w){
    if(w === 'all' || w === 'beyond') return [];
    const n = lite ? 8 : (small ? 14 : 26), a = [];
    for(let i = 0; i < n; i++){
      const p = { x:Math.random() * W, y:Math.random() * H, ph:Math.random() * 6.28 };
      if(w === 'kirax'){ p.vy = rnd(30, 100) * dpr; p.len = rnd(18, 70) * dpr; p.a = rnd(0.14, 0.4); }
      else if(w === 'vedtoria'){ p.vx = rnd(-5, 5) * dpr; p.vy = -rnd(4, 14) * dpr; p.r = rnd(6, 13) * dpr; }
      else if(w === 'warship'){ p.vx = -rnd(50, 180) * dpr; p.len = rnd(8, 24) * dpr; p.a = rnd(0.25, 0.75); p.hot = Math.random() < 0.5; }
      else if(w === 'monster'){ p.vy = -rnd(18, 60) * dpr; p.vx = rnd(-4, 4) * dpr; p.r = rnd(6, 13) * dpr; }
      a.push(p);
    }
    return a;
  }
  function drawAmb(t, dt){
    amb += (1 - amb) * (1 - Math.exp(-dt * 1.4));
    for(let i = 0; i < parts.length; i++){
      const p = parts[i];
      if(world === 'kirax'){                                     // data rain
        p.y += p.vy * dt; if(p.y - p.len > H){ p.y = -p.len; p.x = Math.random() * W; }
        ctx.globalAlpha = p.a * amb; ctx.strokeStyle = ctx.fillStyle = 'rgb(70,240,255)'; ctx.lineWidth = dpr;
        ctx.beginPath(); ctx.moveTo(p.x, p.y - p.len); ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.fillRect(p.x - dpr, p.y - dpr, 2 * dpr, 2 * dpr);
      } else if(world === 'vedtoria'){                           // fireflies
        p.x += p.vx * dt + Math.sin(t * 0.0006 + p.ph) * 0.3 * dpr; p.y += p.vy * dt;
        if(p.y < -20){ p.y = H + 20; p.x = Math.random() * W; }
        ctx.globalAlpha = (0.3 + 0.7 * Math.abs(Math.sin(t * 0.0011 + p.ph))) * amb;
        ctx.drawImage(GL.green, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      } else if(world === 'warship'){                            // sparks streaming past
        p.x += p.vx * dt; if(p.x < -p.len){ p.x = W + p.len; p.y = Math.random() * H; }
        ctx.globalAlpha = p.a * amb; ctx.strokeStyle = p.hot ? 'rgb(255,170,90)' : 'rgb(255,80,100)'; ctx.lineWidth = dpr * 1.2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.len, p.y); ctx.stroke();
      } else if(world === 'monster'){                            // rising embers
        p.y += p.vy * dt; p.x += p.vx * dt + Math.sin(t * 0.0012 + p.ph) * 0.35 * dpr;
        if(p.y < -20){ p.y = H + 20; p.x = Math.random() * W; }
        ctx.globalAlpha = (0.35 + 0.65 * Math.abs(Math.sin(t * 0.004 + p.ph * 3))) * amb;
        ctx.drawImage(GL.orange, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      }
    }
    if(world === 'warship'){                                     // slow red scanner beam every ~12s
      const cyc = (t % 12000) / 12000;
      if(cyc < 0.32){
        const bx = (-0.2 + 1.4 * cyc / 0.32) * W, bw = 170 * dpr, g = ctx.createLinearGradient(bx - bw, 0, bx + bw, 0);
        g.addColorStop(0, 'rgba(255,60,80,0)'); g.addColorStop(0.5, 'rgba(255,60,80,.10)'); g.addColorStop(1, 'rgba(255,60,80,0)');
        ctx.globalAlpha = amb; ctx.fillStyle = g; ctx.fillRect(bx - bw, 0, bw * 2, H);
      }
    }
    ctx.globalAlpha = 1;
  }
  function drawComet(t, dt){                                     // comets in open space
    if(world !== 'all' && world !== 'beyond') return;
    if(!comet){
      if(t > nextComet && amb > 0.5){
        const dir = Math.random() < 0.5 ? 1 : -1, ang = rnd(0.35, 0.65), sp = (small ? 520 : 760) * dpr;
        comet = { x:(dir > 0 ? rnd(-0.1, 0.5) : rnd(0.5, 1.1)) * W, y:rnd(-0.05, 0.4) * H, vx:Math.cos(ang) * sp * dir, vy:Math.sin(ang) * sp, age:0, life:rnd(1.1, 1.7), len:rnd(110, 190) * dpr };
        nextComet = t + (world === 'beyond' ? rnd(3500, 7000) : rnd(8000, 14000));
      }
      return;
    }
    comet.age += dt; comet.x += comet.vx * dt; comet.y += comet.vy * dt;
    const k = comet.age / comet.life; if(k >= 1){ comet = null; return; }
    const a = Math.sin(k * Math.PI), mag = Math.hypot(comet.vx, comet.vy), tx2 = comet.x - comet.vx / mag * comet.len, ty2 = comet.y - comet.vy / mag * comet.len;
    const gr = ctx.createLinearGradient(comet.x, comet.y, tx2, ty2);
    gr.addColorStop(0, 'rgba(255,255,255,' + a + ')'); gr.addColorStop(0.3, 'rgba(120,220,255,' + a * 0.45 + ')'); gr.addColorStop(1, 'rgba(120,220,255,0)');
    ctx.strokeStyle = gr; ctx.lineWidth = 1.8 * dpr; ctx.beginPath(); ctx.moveTo(comet.x, comet.y); ctx.lineTo(tx2, ty2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')'; ctx.beginPath(); ctx.arc(comet.x, comet.y, 1.6 * dpr, 0, 6.2832); ctx.fill();
  }

  /* ---- world switch (called from apply()) ---- */
  fxSetWorld = w => {
    world = w; amb = 0; comet = null; nextComet = performance.now() + 2500; parts = spawn(w);
    const next = 1 - bandOn;
    paintBand(bands[next], hexRGB(WORLDS[w].color));
    bands[bandOn].classList.remove('on'); bands[next].classList.add('on'); bandOn = next;
  };

  /* ---- frame ---- */
  function fit(){
    dpr = Math.min(window.devicePixelRatio || 1, small ? 1.25 : 1.5);
    W = cv.width = Math.round(innerWidth * dpr); H = cv.height = Math.round(innerHeight * dpr);
  }
  function draw(t, dt){
    ctx.clearRect(0, 0, W, H);
    px += (tx - px) * 0.05; py += (ty - py) * 0.05;
    const sc = window.scrollY * dpr * 0.22;
    ctx.globalAlpha = 0.5;
    for(const m of smudges) ctx.drawImage(m.spr, m.x * W - px * W * m.d - m.w / 2, m.y * H - py * H * m.d - sc * m.d * 8 - m.w / 2, m.w, m.w);
    for(const s of stars){
      s.x += dt * 0.004 * s.z; if(s.x > 1.02) s.x -= 1.04;
      const x = s.x * W - px * W * 0.04 * s.z;
      let y = (s.y * H - sc * s.z - py * H * 0.03 * s.z) % H; if(y < 0) y += H;
      const size = (0.5 + s.z * 1.3) * dpr;
      ctx.globalAlpha = (0.25 + 0.75 * s.z) * (0.75 + 0.25 * Math.sin(t * 0.0015 + s.tw));
      ctx.fillStyle = s.warm ? 'rgb(255,214,160)' : 'rgb(215,238,255)';
      if(size < 1.4) ctx.fillRect(x, y, size, size); else { ctx.beginPath(); ctx.arc(x, y, size / 2, 0, 6.2832); ctx.fill(); }
    }
    for(const m of motes){                                       // out-of-focus dust close to the camera
      m.x += m.vx * dt; m.y += m.vy * dt;
      if(m.x < -0.1) m.x = 1.1; else if(m.x > 1.1) m.x = -0.1; if(m.y < -0.1) m.y = 1.1; else if(m.y > 1.1) m.y = -0.1;
      ctx.globalAlpha = m.a; ctx.drawImage(MSPR[m.c], m.x * W - px * W * m.d - m.r, m.y * H - py * H * m.d - sc * m.d * 4 - m.r, m.r * 2, m.r * 2);
    }
    ctx.globalAlpha = 1;
    if(dt){ drawAmb(t, dt); drawComet(t, dt); }
  }
  function frame(t){
    raf = requestAnimationFrame(frame);
    if(t - last < 33 || lbOpen) return;                          // 30fps, idle while the viewer is open
    const dt = Math.min((t - last) / 1000, 0.1); last = t;
    draw(t, dt);
  }

  fit(); buildProps();
  paintBand(bands[0], hexRGB(WORLDS.all.color)); bands[0].classList.add('on');
  let rw = innerWidth, rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
    if(innerWidth === rw) return; rw = innerWidth; fit(); buildProps(); parts = spawn(world);
    paintBand(bands[bandOn], hexRGB(WORLDS[world].color)); if(!raf) draw(0, 0);
  }, 200); });
  addEventListener('scroll', () => { const y = -Math.min(scrollY * 0.05, innerHeight * 0.025); bands.forEach(b => b.style.transform = 'translate3d(0,' + y + 'px,0) scale(1.06)'); }, { passive:true });

  if(reduce){ amb = 1; draw(0, 0); }
  else {
    if(fine) addEventListener('pointermove', e => { tx = e.clientX / innerWidth - 0.5; ty = e.clientY / innerHeight - 0.5; }, { passive:true });
    raf = requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', () => {
      if(document.hidden){ cancelAnimationFrame(raf); raf = 0; }
      else if(!raf){ last = performance.now(); raf = requestAnimationFrame(frame); }
    });
  }
})();

apply();
</script>
</body>
</html>
