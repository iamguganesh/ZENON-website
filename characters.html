<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040c">
<title>NOVAZONE ARCHIVE | ZENON Fictional Universe</title>
<meta name="description" content="The NOVAZONE and DRAGON WORLD archives: characters, ships, planets, dragons and armies of the ZENON fictional universe by K.G.ZENON.">
<meta name="author" content="K.G.ZENON">
<link rel="icon" type="image/webp" href="favicon.webp">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- only the 3 weights the page uses -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#03040c;--a:#8fdcff;--text:#e9f2ff;--muted:#8fa2c2;--display:'Orbitron','Segoe UI',system-ui,sans-serif;--ease:cubic-bezier(.16,.84,.24,1)}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);scroll-behavior:smooth}
body{color:var(--text);min-height:100vh;isolation:isolate;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.lb-open{overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}

/* background: stars canvas + one soft glow per world */
#space{position:fixed;inset:0;width:100%;height:100%;z-index:-3;pointer-events:none}
.g{position:fixed;inset:0;z-index:-2;opacity:0;pointer-events:none;transition:opacity 1.1s ease;
  background:radial-gradient(60% 45% at 20% 10%,color-mix(in srgb,var(--gc) 21%,transparent),transparent 70%),radial-gradient(50% 45% at 85% 30%,color-mix(in srgb,var(--gc) 14%,transparent),transparent 70%),radial-gradient(60% 40% at 50% 100%,color-mix(in srgb,var(--gc) 10%,transparent),transparent 70%)}
.g.on{opacity:1}
.vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,8,.72) 100%)}
.horizon{position:fixed;left:-28vw;right:-28vw;bottom:0;height:14vh;z-index:-1;pointer-events:none;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(180deg,rgba(2,3,10,.97),#010207);
  box-shadow:0 -2px 3px color-mix(in srgb,var(--a) 80%,#fff),0 -8px 26px color-mix(in srgb,var(--a) 62%,transparent),0 -40px 110px color-mix(in srgb,var(--a) 34%,transparent);transition:box-shadow .9s ease}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:linear-gradient(rgba(3,4,12,.96),rgba(3,4,12,.84))}
.back-btn{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#eaf6ff;text-decoration:none;font:700 .66rem/1 var(--display);letter-spacing:.12em;transition:border-color .25s,background .25s}
.back-btn:hover{border-color:var(--a);background:rgba(255,255,255,.1)}
.worlds{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 2px 2px 0}
.worlds::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:999px;cursor:pointer;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#cfdcf2;font:700 .64rem/1 var(--display);letter-spacing:.1em;white-space:nowrap;transition:border-color .25s,background .25s,box-shadow .25s,color .25s;-webkit-tap-highlight-color:transparent}
.chip:hover{border-color:var(--c,#fff)}
.chip .orb{width:12px;height:12px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 42%,#000 135%);box-shadow:0 0 10px var(--c)}
.chip em{font-style:normal;font-weight:400;opacity:.6}
.chip[aria-pressed="true"]{color:#fff;border-color:var(--c);background:color-mix(in srgb,var(--c) 17%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 32%,transparent)}

/* header */
.hero{position:relative;text-align:center;padding:26px 18px 6px;overflow:hidden}
.orbits{position:absolute;left:50%;top:52%;width:min(92vw,620px);aspect-ratio:1;transform:translate(-50%,-50%);perspective:800px;pointer-events:none;opacity:.7}
.ring{position:absolute;border-radius:50%;border:1px solid var(--a);transition:border-color .8s}
.ring::before{content:"";position:absolute;top:-4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a),0 0 26px var(--a)}
.r1{inset:0;opacity:.24;transform:rotateX(74deg);animation:orbA 42s linear infinite}
.r2{inset:13%;opacity:.32;transform:rotateX(66deg) rotateY(20deg);animation:orbB 28s linear infinite reverse}
.r3{inset:30%;opacity:.4;transform:rotateX(78deg);animation:orbA 19s linear infinite}
@keyframes orbA{to{transform:rotateX(74deg) rotateZ(360deg)}}
@keyframes orbB{to{transform:rotateX(66deg) rotateY(20deg) rotateZ(360deg)}}
.orbits.paused .ring{animation-play-state:paused}
.logo{position:relative;display:block;width:56px;height:56px;margin:0 auto 12px;border-radius:50%;box-shadow:0 0 30px rgba(255,190,90,.25)}
h1{position:relative;font:900 clamp(1.9rem,6.4vw,3.6rem)/1.05 var(--display);letter-spacing:.06em;background:linear-gradient(180deg,#fff 25%,var(--a) 140%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{position:relative;max-width:560px;margin:12px auto 0;color:var(--muted);font-size:.98rem;line-height:1.6}
.notice{position:relative;max-width:640px;margin:18px auto 0;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(3,4,12,.55);color:#b9c8e2;font-size:.82rem;line-height:1.5}
.unis{position:relative;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px auto 0}
.unis .chip{min-height:44px;padding:0 22px;font-size:.74rem;letter-spacing:.14em}
.unis .chip .orb{width:14px;height:14px}

/* tools */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;max-width:1500px;margin:22px auto 0;padding:0 18px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:999px;overflow:hidden}
.seg button{min-height:38px;padding:0 16px;border:0;background:transparent;cursor:pointer;color:#cfdcf2;font:700 .64rem/1 var(--display);letter-spacing:.12em;transition:background .25s,color .25s}
.seg button:hover{background:rgba(255,255,255,.08)}
.seg button[aria-pressed="true"]{background:var(--a);color:#03040c}
.search{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:var(--muted)}
.search:focus-within{border-color:var(--a)}
.search input{width:min(52vw,220px);border:0;outline:0;background:transparent;font-size:.9rem;color:var(--text)}
.search input::placeholder{color:#6f83a6}
.banner{display:flex;justify-content:space-between;gap:12px;max-width:1500px;margin:22px auto 14px;padding:0 20px;font:400 .68rem/1.4 var(--display);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.banner b{color:var(--a);font-weight:700;transition:color .8s}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:1500px;margin:0 auto;padding:4px 18px 80px}
.card{position:relative;aspect-ratio:3/4.1;perspective:900px;outline:none;-webkit-tap-highlight-color:transparent;animation:scanIn .5s var(--ease) calc(var(--i,0)*24ms) backwards}
@keyframes scanIn{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s var(--ease)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:#070a18;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 10px 28px rgba(0,0,0,.5);transition:box-shadow .35s}
@media (hover:hover){.card:hover .face{box-shadow:0 12px 32px rgba(0,0,0,.55),0 0 26px color-mix(in srgb,var(--c) 38%,transparent)}}
.card:focus-visible .face{outline:2px solid var(--c);outline-offset:3px}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;transition:transform .9s var(--ease);user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
@media (hover:hover){.card:hover .art{transform:scale(1.05)}}
.front::after{content:"";position:absolute;inset:auto 0 0 0;height:66%;background:linear-gradient(transparent,rgba(3,4,14,.96));pointer-events:none}
.cap{position:absolute;left:14px;right:14px;bottom:14px;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.cap h3{font:700 .86rem/1.3 var(--display);letter-spacing:.04em;color:#fff}
.cap .lbl{display:block;margin-top:6px;font:400 .58rem/1 var(--display);letter-spacing:.2em;color:var(--c);text-transform:uppercase}
.pw{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin-top:8px}
.pw li{padding:3px 8px;border-radius:999px;font-size:.64rem;line-height:1.3;color:#fff;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 16%,rgba(3,4,14,.6))}
.zoom,.nav{position:absolute;z-index:4;display:grid;place-items:center;border:0;cursor:pointer;color:#eaffff;background:rgba(3,4,14,.62);transition:background .25s,color .25s,opacity .25s;-webkit-tap-highlight-color:transparent}
.zoom{top:14px;right:14px;width:32px;height:32px;border-radius:50%}
.nav{top:42%;width:28px;height:44px;margin-top:-22px;border-radius:8px;font-size:22px;line-height:1}
.nav.prev{left:8px}.nav.next{right:8px}
.zoom:hover,.nav:hover{background:var(--c);color:#03040c}
.count{position:absolute;z-index:4;top:14px;left:14px;padding:5px 9px;border-radius:999px;background:rgba(3,4,14,.62);font:400 .58rem/1 var(--display);letter-spacing:.12em;color:var(--c)}
@media (hover:hover){.nav{opacity:0}.card:hover .nav,.nav:focus-visible{opacity:1}}

.back{transform:rotateY(180deg);padding:18px 16px 14px;display:flex;flex-direction:column;gap:12px;overflow:auto;scrollbar-width:thin;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),linear-gradient(160deg,rgba(13,18,42,.99),rgba(4,6,18,.99))}
.back .file{font:400 .56rem/1 var(--display);letter-spacing:.22em;color:var(--c);text-transform:uppercase}
.back h4{font:700 .95rem/1.3 var(--display);letter-spacing:.03em;color:#fff}
.about{font-size:.86rem;line-height:1.65;color:#e6eefb}
.row{font-size:.78rem;line-height:1.5;color:#c9d6ec}
.row b{display:block;margin-bottom:5px;font:400 .54rem/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:#7f92b3}
.hint{margin-top:auto;padding-top:6px;font:400 .52rem/1 var(--display);letter-spacing:.2em;color:#5f7090;text-transform:uppercase}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--muted);font:400 .8rem/1.6 var(--display);letter-spacing:.14em}

/* chapter card */
.chapter{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;background:radial-gradient(60% 38% at 50% 50%,rgba(2,3,10,.78),transparent 78%)}
.chapter.go{display:flex;animation:chBg 1.9s ease both}
.chapter h2{font:900 clamp(1.8rem,7.4vw,4.2rem)/1 var(--display);color:#fff;letter-spacing:.14em;padding-left:.14em;text-shadow:0 0 34px var(--a),0 0 8px var(--a)}
.chapter .chline{width:min(62vw,440px);height:2px;margin:18px 0 14px;background:linear-gradient(90deg,transparent,var(--a),#fff,var(--a),transparent);box-shadow:0 0 18px var(--a);transform:scaleX(0)}
.chapter p{font:400 .72rem/1.4 var(--display);letter-spacing:.3em;padding-left:.3em;color:#d6ebff;text-transform:uppercase}
.chapter.go h2{animation:chTrack 1.9s cubic-bezier(.2,.7,.2,1) both}
.chapter.go .chline{animation:chLine 1.9s ease both}
@keyframes chBg{0%{opacity:0}18%{opacity:1}72%{opacity:1}100%{opacity:0}}
@keyframes chTrack{0%{opacity:0;letter-spacing:.55em;transform:scale(1.07)}26%{opacity:1}72%{opacity:1}100%{opacity:0;letter-spacing:.2em;transform:none}}
@keyframes chLine{0%{transform:scaleX(0)}32%,100%{transform:scaleX(1)}}

/* image viewer (full-size image loads only here) */
.lb{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(2,3,10,.95);animation:lbIn .22s ease}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lb figure{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:92vw}
.lb img{max-width:92vw;max-height:80vh;object-fit:contain;border-radius:10px;border:1px solid color-mix(in srgb,var(--a) 60%,transparent);box-shadow:0 0 44px color-mix(in srgb,var(--a) 25%,transparent)}
.lb figcaption{font:400 .7rem/1.4 var(--display);letter-spacing:.16em;color:#cfe3f5;text-align:center}
.lb-btn,.lb-close{position:absolute;z-index:2;border:0;cursor:pointer;color:#eaffff;background:rgba(3,4,14,.7);transition:background .25s,color .25s;-webkit-tap-highlight-color:transparent}
.lb-btn{top:50%;width:48px;height:64px;margin-top:-32px;border-radius:10px;font-size:34px;line-height:1}
.lb-btn.prev{left:16px}.lb-btn.next{right:16px}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 16px);right:18px;width:44px;height:44px;border-radius:50%;font-size:28px;line-height:1}
.lb-btn:hover,.lb-close:hover{background:var(--a);color:#03040c}

@media (max-width:640px){
  .back-btn .lbl{display:none}.back-btn{padding:0 13px}
  .unis .chip{padding:0 16px;font-size:.66rem}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 10px 60px}
  .cap{left:10px;right:10px;bottom:10px}.cap h3{font-size:.74rem}.pw li{font-size:.56rem;padding:2px 6px}
  .back{padding:13px 11px 9px;gap:7px}.back h4{font-size:.8rem}.about{font-size:.74rem;line-height:1.5}.row{font-size:.68rem}
  .banner{font-size:.6rem}#bNote,.sep{display:none}
  .lb-btn{width:40px;height:54px;margin-top:-27px;font-size:28px}.lb-btn.prev{left:8px}.lb-btn.next{right:8px}
}
@media (prefers-reduced-motion:reduce){
  .chapter{display:none!important}
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>

<body>
<canvas id="space" aria-hidden="true"></canvas>
<div id="glows" aria-hidden="true"></div>
<div class="vig" aria-hidden="true"></div>
<div class="horizon" aria-hidden="true"></div>

<nav class="topbar" aria-label="Archive navigation">
  <a class="back-btn" href="index.html" aria-label="Return to the universe"><span aria-hidden="true">←</span><span class="lbl">RETURN TO UNIVERSE</span></a>
  <div class="worlds" id="worlds" role="group" aria-label="Choose a world"></div>
</nav>

<header class="hero">
  <div class="orbits paused" id="orbits" aria-hidden="true"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i></div>
  <img class="logo" src="logo.webp" width="56" height="56" alt="K.G.Z">
  <h1 id="title">NOVAZONE ARCHIVE</h1>
  <p class="sub" id="sub"></p>
  <p class="notice">⚠ Images shown are AI-generated visuals created to represent the characters, ships, and environments.</p>
  <div class="unis" id="unis" role="group" aria-label="Choose a universe">
    <button type="button" class="chip" data-u="novazone" style="--c:#8fdcff" aria-pressed="true"><i class="orb"></i>NOVAZONE</button>
    <button type="button" class="chip" data-u="dragonworld" style="--c:#ffd36a" aria-pressed="false"><i class="orb"></i>DRAGON WORLD</button>
  </div>
</header>

<div class="tools">
  <div class="seg" id="types" role="group" aria-label="Filter by type">
    <button type="button" data-t="all" aria-pressed="true">ALL</button>
    <button type="button" data-t="characters" aria-pressed="false">CHARACTERS</button>
    <button type="button" data-t="other" aria-pressed="false">OTHER</button>
  </div>
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search the archive…" autocomplete="off" aria-label="Search the archive">
  </label>
</div>

<div class="banner"><span><b id="bName">ALL WORLDS</b><span class="sep"> · </span><span id="bNote"></span></span><span id="bCount"></span></div>

<main class="grid" id="grid" aria-live="polite"></main>

<div class="chapter" id="chapter" aria-hidden="true"><h2 id="chName"></h2><i class="chline"></i><p id="chNote"></p></div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="lb-close" id="lbClose" type="button" aria-label="Close">×</button>
  <button class="lb-btn prev" id="lbPrev" type="button" aria-label="Previous image">‹</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button class="lb-btn next" id="lbNext" type="button" aria-label="Next image">›</button>
</div>

<script>
/* ═══ DATA ═══════════════════════════════════════════════════════════
   Per entry:  img / images · name · role · power ("a,b,c") · zone · type
   NEW:        about:"text shown on the back of the card"
               (if empty, the back shows the role instead)
   NOVAZONE worlds: kirax · vedtoria · warship · monster · beyond  (optional world:"…")
   ══════════════════════════════════════════════════════════════════ */
const novazone = [
{img:"kiraxplanet.webp",name:"Kirax 17",role:"highly advanced planet",about:`Kirax 17 is a highly advanced planet inhabited by the blue-haired, glowing-eyed Kiraxians. It features futuristic cities, towering electric-blue skyscrapers, advanced robots, flying spaceships, and two orbital rings. The planet also contains the mysterious Monster Zone, a vast region surrounded by mountains where ancient monsters live.`,type:"other"},
{img:"vedtoriaplanet.webp",name:"Vedtoria",role:"Nature and magical Planet",about:`Vedtoria is a magical planet filled with lush nature, extraordinary wildlife, and mysterious green auras. Its inhabitants, known as Vedtorians, live in a world where magic is part of everyday life. Unlike technologically advanced planets, Vedtoria relies on magic rather than modern technology, with small houses surrounded by beautiful natural landscapes.`,type:"other"},
{img:"gegozorous.webp",name:"Gegozorous",role:"Ancient Monster Guardian",about:`Gegozorous is an ancient monster guardian living in the Monster Zone of Kirax 17. Standing over 100 feet tall, it possesses massive wings, powerful limbs, and a long tail. It can control electricity and absorb electrical energy to heal its wounds while in its rage state. Despite its immense power, it cannot survive in deep water.`,power:"Electric + Regeneration(while in rage),electricity absorption,super strength",zone:"Monster Zone",type:"characters"},
{img:"spaceship.webp",name:"Zetorex's Warship",role:"army Carrier Ship",about:`Zetorex's Warship is a colossal interstellar carrier designed to transport Zetorex's army and deploy fleets of smaller spaceships. Equipped with advanced weapons, laser cannons, a defensive shield, an invisible mode, and an automatic repair system, it serves as a powerful mobile base for interplanetary invasions. Its advanced FTL engines allow it to travel across vast distances of space.`,power:"Laser Cannons + FTL Travel,invisible mode,defender shield,high tech weapons,automatic repair system",zone:"Space",type:"other"},
{img:"zetorex.webp",name:"Zetorex",role:"Cosmic Commander(God of destruction)",about:`Zetorex is a cosmic conqueror known as the King of Destruction. Born from the destruction of two collapsing galaxies, he possesses immense dark energy and commands a powerful, technologically advanced army. He can hypnotize enemies and alter his size to match his opponents. His legendary weapon, the Glazerblade, is capable of shattering planetary cores.`,power:"Dark Energy,size shifiting(~10 ft to exceed enemy size),hyponosis,stronger hits when enemy is bigger",zone:"Warship",type:"characters"},
{img:"nirious.webp",name:"Nirous",role:"Nature Guardian",about:`Nirous is the son of Vedos and Lucas, the protectors of Vedtoria. He is a young Vedtorian who has practiced magic but has yet to discover his true abilities. He has a strong connection to his planet's nature and magical heritage.`,power:"Cosmic Energy",zone:"Stellar Rift",type:"characters"},
{img:"juncy.webp",name:"Juncy",role:"supporter",about:`Juncy is a skilled Systems Engineer of Kirax 17 who works alongside Kiron to develop advanced technologies and support strategic operations. Known for her adaptive intelligence and problem-solving abilities, she helps overcome technological challenges and contributes to the development of her planet.`,power:"adaptive intelligence",zone:"kirax planet",type:"characters"},
{img:"kiron.webp",name:"Kiron",role:"Tactical leader",about:`Kiron is the Chief Technology Advisor of Kirax 17, responsible for managing the planet's technological systems and strategic development. Known for his strategic genius and analytical thinking, he works with advanced technology to solve complex problems and protect his civilization.`,power:"Strategic Genius",zone:"kirax planet",type:"characters"},
{img:"maton.webp",name:"Maton",role:"frontline fighter",about:`Maton is a courageous soldier of the Kiraxian Army and one of Kiron's closest friends. Known for his enhanced strength, durability, and frontline combat skills, he fights to defend Kirax 17 and protect its people.`,power:"Enhanced Strength and Durability",zone:"kirax planet",type:"characters"},
{img:"sherby.webp",name:"Sherby",role:"systembreaker",about:`Sherby is the Cyber Warfare Specialist of Kirax 17, specializing in hacking advanced systems, bypassing security, and controlling unfamiliar technology. With her cyber intelligence and technical skills, she can overcome complex technological barriers and operate enemy machinery. Her expertise makes her a valuable asset in both planetary defense and high-risk missions.`,power:"cybermind",zone:"kirax planet",type:"characters"},

/* ═══ SETTINGS ═══════════════════════════════════════════════════════
   USE_THUMBS: set true after you create a /thumbs folder with small (~480px) copies
   of every image (same file names). Cards then load the small copy and only the zoom
   viewer loads the full image.
   ══════════════════════════════════════════════════════════════════ */
const USE_THUMBS = false;
const conn = navigator.connection || {};
const SAVE = !!conn.saveData || /(^|-)2g$/.test(conn.effectiveType || '');
const thumb = s => USE_THUMBS ? 'thumbs/' + s : s;

const WORLDS = {
  all:{label:'ALL WORLDS',note:'Every file in the archive',color:'#8fdcff'},
  kirax:{label:'KIRAX 17',note:'Highly advanced planet',color:'#37f0ff'},
  vedtoria:{label:'VEDTORIA',note:'Nature and magical planet',color:'#3dffa0'},
  warship:{label:'WARSHIP',note:"Zetorex's army carrier",color:'#ff4d5e'},
  monster:{label:'MONSTER ZONE',note:'Ancient monster region',color:'#ffb02e'},
  beyond:{label:'BEYOND',note:'Earth, the Stellar Rift and deep space',color:'#a58bff'},
  dall:{label:'ALL DRAGON FILES',note:'Every file in the Dragon World archive',color:'#ffd36a'},
  realm:{label:'DRAGON WORLD',note:'Home of dragons',color:'#e07bff'},
  wind:{label:'WIND BIOME',note:'Dragons of the wind',color:'#7ee8d0'},
  volcanic:{label:'VOLCANO',note:'Guardians of lava and fire',color:'#ff6a2e'},
  river:{label:'RIVER',note:'Water dragons of the rivers',color:'#3aa8ff'},
  deepsea:{label:'DEEP SEA',note:'Guardians of the ocean depths',color:'#6b7bff'},
  ice:{label:'ICE BIOME',note:'Dragons of the frozen lands',color:'#bfeaff'}
};
function novaWorldOf(it){
  if(it.world && WORLDS[it.world]) return it.world;
  const z=(it.zone||'').toLowerCase(), n=it.name.toLowerCase();
  if(z.includes('monster')||n.includes('monster')) return 'monster';
  if(z.includes('vedtoria')||n.startsWith('vedtoria')) return 'vedtoria';
  if(z.includes('kirax')||n.startsWith('kirax')) return 'kirax';
  if(z.includes('warship')||z==='space') return 'warship';
  return 'beyond';
}
function dragonWorldOf(it){
  if(it.world && WORLDS[it.world]) return it.world;
  const b=(it.birthbiome||'').toLowerCase();
  if(b.includes('wind')) return 'wind';
  if(b.includes('volcan')||b.includes('lava')) return 'volcanic';
  if(b.includes('river')) return 'river';
  if(b.includes('ocean')||b.includes('sea')) return 'deepsea';
  if(b.includes('ice')) return 'ice';
  return 'realm';
}
const UNIVERSES = {
  novazone:{name:'NOVAZONE',title:'NOVAZONE ARCHIVE',tag:'The cosmic universe',sub:'Characters, ships, armies and worlds from the cosmic universe of K.G.ZENON.',doc:'NOVAZONE ARCHIVE | ZENON Fictional Universe',data:novazone,all:'all',order:['kirax','vedtoria','warship','monster','beyond'],charLabel:'CHARACTERS',worldOf:novaWorldOf},
  dragonworld:{name:'DRAGON WORLD',title:'DRAGON WORLD ARCHIVE',tag:'Home of dragons',sub:'Dragons, biomes and ancient realms from the universe of K.G.ZENON.',doc:'DRAGON WORLD ARCHIVE | ZENON Fictional Universe',data:dragonzone,all:'dall',order:['realm','wind','volcanic','river','deepsea','ice'],charLabel:'DRAGONS',worldOf:dragonWorldOf}
};

/* ═══ HELPERS ═══ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : '';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine = matchMedia('(hover:hover) and (pointer:fine)').matches && !reduce;

Object.values(UNIVERSES).forEach(U=>U.data.forEach(it=>{
  if(!it.type) it.type = it.birthbiome ? 'characters' : 'other';
  if(!it.zone && it.birthbiome) it.zone = it.birthbiome;
  it._w = U.worldOf(it); it._imgs = it.images || [it.img]; it._cur = 0;
  it._pw = (it.power||'').split(',').map(s=>s.trim()).filter(Boolean);
}));

const grid=$('#grid'), worldsEl=$('#worlds'), typesEl=$('#types'), unisEl=$('#unis'), chapterEl=$('#chapter');
const state={uni:'novazone',world:'all',type:'all',q:''};
let U=UNIVERSES.novazone, view=[], fxWorld='all', booted=false, pendingChapter=null, lbOpen=false, fxSetWorld=()=>{};

/* glow layers, one per world */
$('#glows').innerHTML = Object.keys(WORLDS).map(k=>`<i class="g" data-k="${k}" style="--gc:${WORLDS[k].color}"></i>`).join('');

function showChapter(W){
  if(reduce) return;
  $('#chName').textContent=W.label; $('#chNote').textContent=W.note||W.tag||'';
  chapterEl.classList.remove('go'); void chapterEl.offsetWidth; chapterEl.classList.add('go');
}
chapterEl.addEventListener('animationend',e=>{ if(e.target===chapterEl) chapterEl.classList.remove('go'); });

function buildChips(){
  const counts={}; U.data.forEach(it=>counts[it._w]=(counts[it._w]||0)+1);
  const keys=[U.all].concat(U.order.filter(k=>counts[k]));
  worldsEl.innerHTML=keys.map(k=>`<button type="button" class="chip" data-w="${k}" style="--c:${WORLDS[k].color}" aria-pressed="false"><i class="orb"></i>${WORLDS[k].label}<em>${k===U.all?U.data.length:counts[k]}</em></button>`).join('');
}

/* ═══ CARDS: front = image + powers + zoom · back = About ═══ */
function cardHTML(it,i){
  const W=WORLDS[it._w], n=it._imgs.length, pw=it._pw;
  const chips=pw.slice(0,3).map(s=>`<li>${esc(cap(s))}</li>`).join('')+(pw.length>3?`<li>+${pw.length-3}</li>`:'');
  const more=pw.length>3?`<div class="row"><b>All abilities</b>${esc(pw.map(cap).join(' · '))}</div>`:'';
  return `
  <article class="card" data-i="${i}" tabindex="0" style="--c:${W.color};--i:${Math.min(i,18)}" aria-label="${esc(it.name)}. Press Enter to read the about section.">
    <div class="tilt"><div class="inner">
      <div class="face front">
        <img class="art" src="${esc(thumb(it._imgs[it._cur]))}" alt="${esc(it.name)}" ${i<4?'fetchpriority="high" ':'loading="lazy" '}decoding="async" draggable="false">
        <button type="button" class="zoom" aria-label="View full image"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        ${n>1?`<button type="button" class="nav prev" aria-label="Previous image">‹</button><button type="button" class="nav next" aria-label="Next image">›</button><span class="count">${it._cur+1} / ${n}</span>`:''}
        <div class="cap"><h3>${esc(it.name)}</h3>${chips?`<ul class="pw">${chips}</ul>`:`<span class="lbl">${W.label}</span>`}</div>
      </div>
      <div class="face back">
        <div class="file">${it.about?'About':'File'} · ${W.label}</div>
        <h4>${esc(it.name)}</h4>
        ${it.about?`<p class="about">${esc(it.about)}</p>`:''}
        ${it.role?`<div class="row"><b>Role</b>${esc(cap(it.role))}</div>`:''}
        ${more}
        ${it.zone?`<div class="row"><b>${it.birthbiome?'Birth biome':'Zone'}</b>${esc(cap(it.zone))}</div>`:''}
        <span class="hint">Tap to flip back</span>
      </div>
    </div></div>
  </article>`;
}
function render(){ grid.innerHTML=view.length?view.map(cardHTML).join(''):'<p class="empty">NO FILES MATCH YOUR SEARCH</p>'; }

function updateUI(){
  const W=WORLDS[state.world];
  document.body.style.setProperty('--a',W.color);
  document.querySelectorAll('.g').forEach(g=>g.classList.toggle('on',g.dataset.k===state.world));
  worldsEl.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.w===state.world));
  typesEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===state.type));
  unisEl.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.u===state.uni));
  $('#bName').textContent=W.label; $('#bNote').textContent=W.note;
  $('#bCount').textContent=view.length+(view.length===1?' file':' files');
}
function apply(){
  const q=state.q.trim().toLowerCase();
  view=U.data.filter(it=>(state.world===U.all||it._w===state.world)&&(state.type==='all'||it.type===state.type)&&
    (!q||(it.name+' '+(it.role||'')+' '+(it.about||'')+' '+(it.power||'')+' '+(it.zone||'')+' '+(it.birthbiome||'')).toLowerCase().includes(q)));
  render(); updateUI();
  if(state.world!==fxWorld){
    fxWorld=state.world; fxSetWorld(fxWorld);
    if(booted) showChapter(pendingChapter||WORLDS[fxWorld]);
  }
  pendingChapter=null; booted=true;
}
function setUniverse(k){
  if(!UNIVERSES[k]) k='novazone';
  const changed=k!==state.uni;
  state.uni=k; U=UNIVERSES[k]; state.world=U.all; state.type='all'; state.q=''; $('#q').value='';
  buildChips();
  $('#title').textContent=U.title; $('#sub').textContent=U.sub; document.title=U.doc;
  typesEl.querySelector('[data-t="characters"]').textContent=U.charLabel;
  if(changed&&booted) pendingChapter={label:U.name,note:U.tag};
  apply();
}

worldsEl.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  state.world=c.dataset.w; apply();
  c.scrollIntoView({inline:'center',block:'nearest',behavior:reduce?'auto':'smooth'});
});
unisEl.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b||b.dataset.u===state.uni) return;
  try{history.replaceState(null,'','#'+b.dataset.u);}catch(_){}
  setUniverse(b.dataset.u); window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
});
addEventListener('hashchange',()=>{const k=location.hash.slice(1); if(UNIVERSES[k]&&k!==state.uni) setUniverse(k);});
typesEl.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; state.type=b.dataset.t; apply();});
let qT=0;
$('#q').addEventListener('input',e=>{clearTimeout(qT); qT=setTimeout(()=>{state.q=e.target.value; apply();},120);});

/* ═══ CARD INTERACTION: tap = flip · ⤢ / double-click / long-press = zoom · ‹ › = more pictures ═══ */
let flipT=0, suppress=false;
const itemOf=el=>view[+el.closest('.card').dataset.i];
const flip=card=>card.classList.toggle('flipped');

function step(card,it,d){
  const n=it._imgs.length;
  it._cur=(it._cur+d+n)%n;
  card.querySelector('.art').src=thumb(it._imgs[it._cur]);      // loaded on demand, nothing is preloaded
  card.querySelector('.count').textContent=(it._cur+1)+' / '+n;
}
grid.addEventListener('click',e=>{
  const card=e.target.closest('.card'); if(!card) return;
  const it=itemOf(card), nav=e.target.closest('.nav');
  if(nav){step(card,it,nav.classList.contains('next')?1:-1); return;}
  if(e.target.closest('.zoom')){openZoom(it); return;}
  if(suppress) return;
  clearTimeout(flipT);
  if(fine&&e.target.classList.contains('art')) flipT=setTimeout(()=>flip(card),230);
  else flip(card);
});
grid.addEventListener('dblclick',e=>{ if(!e.target.classList.contains('art')) return; clearTimeout(flipT); openZoom(itemOf(e.target)); });
grid.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault(); flip(e.target);} });

let holdT=0, touchNow=false;
grid.addEventListener('pointerdown',e=>{
  touchNow=e.pointerType==='touch';
  if(!touchNow||!e.target.classList.contains('art')) return;
  const it=itemOf(e.target); clearTimeout(holdT);
  holdT=setTimeout(()=>{suppress=true; openZoom(it); setTimeout(()=>suppress=false,600);},550);
});
['pointerup','pointercancel'].forEach(t=>grid.addEventListener(t,()=>clearTimeout(holdT)));
grid.addEventListener('contextmenu',e=>{ if(touchNow&&e.target.classList.contains('art')) e.preventDefault(); });

if(fine){                                                         // subtle 3D tilt, desktop only
  let raf=0, ev=null, cur=null;
  const reset=c=>{const t=c.firstElementChild; t.style.setProperty('--rx','0deg'); t.style.setProperty('--ry','0deg');};
  grid.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse') return;
    ev=e; if(raf) return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      const card=ev.target.closest&&ev.target.closest('.card');
      if(cur&&cur!==card) reset(cur);
      cur=card; if(!card) return;
      const r=card.getBoundingClientRect(), x=(ev.clientX-r.left)/r.width, y=(ev.clientY-r.top)/r.height, t=card.firstElementChild;
      t.style.setProperty('--rx',((0.5-y)*9).toFixed(2)+'deg'); t.style.setProperty('--ry',((x-0.5)*11).toFixed(2)+'deg');
    });
  });
  grid.addEventListener('pointerleave',()=>{ if(cur){reset(cur); cur=null;} });
}

/* ═══ IMAGE VIEWER — the only place the full-size image is downloaded ═══ */
const lb=$('#lb'), lbImg=$('#lbImg'), lbCap=$('#lbCap'), lbPrev=$('#lbPrev'), lbNext=$('#lbNext');
let lbList=[], lbI=0, lbName='', lbAt=0, lbBack=null;
function lbShow(){
  lbImg.src=lbList[lbI]; lbImg.alt=lbName;
  lbCap.textContent=lbName+(lbList.length>1?'  ·  '+(lbI+1)+' / '+lbList.length:'');
  const multi=lbList.length>1; lbPrev.hidden=lbNext.hidden=!multi;
  if(multi&&!SAVE) new Image().src=lbList[(lbI+1)%lbList.length];   // prefetch only when Data Saver is off
}
function openZoom(it){
  lbList=it._imgs; lbI=it._cur||0; lbName=it.name; lbAt=performance.now(); lbBack=document.activeElement;
  lbShow(); lb.hidden=false; lbOpen=true; document.body.classList.add('lb-open'); $('#lbClose').focus({preventScroll:true});
}
function lbStep(d){lbI=(lbI+d+lbList.length)%lbList.length; lbShow();}
function closeZoom(){
  lb.hidden=true; lbOpen=false; document.body.classList.remove('lb-open'); lbImg.removeAttribute('src');
  if(lbBack&&lbBack.focus) lbBack.focus({preventScroll:true});
}
lb.addEventListener('click',e=>{
  if(performance.now()-lbAt<450) return;
  if(e.target.closest('#lbPrev')) return lbStep(-1);
  if(e.target.closest('#lbNext')) return lbStep(1);
  if(e.target.closest('#lbImg')) return;
  closeZoom();
});
document.addEventListener('keydown',e=>{
  if(!lbOpen) return;
  if(e.key==='Escape') closeZoom();
  else if(e.key==='ArrowLeft'&&lbList.length>1) lbStep(-1);
  else if(e.key==='ArrowRight'&&lbList.length>1) lbStep(1);
});
let sx=0, sy=0;
lb.addEventListener('pointerdown',e=>{sx=e.clientX; sy=e.clientY;});
lb.addEventListener('pointerup',e=>{
  if(e.pointerType!=='touch'||lbList.length<2) return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dy)<80) lbStep(dx<0?1:-1);
});

/* header orbits only animate while visible */
if('IntersectionObserver' in window) new IntersectionObserver(en=>$('#orbits').classList.toggle('paused',!en[0].isIntersecting)).observe($('#orbits'));
else $('#orbits').classList.remove('paused');

/* ═══ LIGHT SPACE BACKGROUND: stars + a small world ambience (no network, 30fps, pauses when hidden or zoomed) ═══ */
(function(){
  const cv=$('#space'), ctx=cv.getContext('2d'), small=innerWidth<769;
  const N=SAVE?40:small?70:120, rnd=(a,b)=>a+Math.random()*(b-a);
  let W=0,H=0,dpr=1,raf=0,last=0,world='all',amb=0,parts=[];
  const stars=Array.from({length:N},()=>({x:Math.random(),y:Math.random(),z:.15+Math.random()*.85,t:Math.random()*6.28,w:Math.random()<.14}));
  const AMB={kirax:['rain'],vedtoria:['fly','90,255,170'],warship:['spark','255,90,110'],monster:['ember','255,150,60'],dall:['ember','255,205,90'],realm:['fly','220,130,255'],wind:['spark','170,245,230'],volcanic:['ember','255,120,50'],river:['fly','70,170,255'],deepsea:['fly','110,125,255'],ice:['fly','210,240,255']};
  const sprites={};
  const spr=c=>sprites[c]||(sprites[c]=(()=>{const s=document.createElement('canvas');s.width=s.height=32;const g=s.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'#fff');r.addColorStop(.15,'rgba('+c+',.9)');r.addColorStop(.45,'rgba('+c+',.25)');r.addColorStop(1,'rgba('+c+',0)');g.fillStyle=r;g.fillRect(0,0,32,32);return s;})());
  function spawn(w){
    const A=AMB[w]; if(!A) return [];
    return Array.from({length:SAVE?6:small?12:22},()=>({x:Math.random()*W,y:Math.random()*H,ph:Math.random()*6.28,r:rnd(6,13)*dpr,len:rnd(10,60)*dpr,v:rnd(20,90)*dpr,a:rnd(.2,.6)}));
  }
  fxSetWorld=w=>{world=w; amb=0; parts=spawn(w); if(!raf) draw(0,0);};
  function fit(){dpr=Math.min(devicePixelRatio||1,small?1.25:1.5); W=cv.width=Math.round(innerWidth*dpr); H=cv.height=Math.round(innerHeight*dpr);}
  function draw(t,dt){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.x+=dt*.004*s.z; if(s.x>1.02) s.x-=1.04;
      const sz=(.5+s.z*1.3)*dpr;
      ctx.globalAlpha=(.25+.75*s.z)*(.75+.25*Math.sin(t*.0015+s.t));
      ctx.fillStyle=s.w?'rgb(255,214,160)':'rgb(215,238,255)';
      ctx.fillRect(s.x*W,s.y*H,sz,sz);
    }
    amb+=(1-amb)*(1-Math.exp(-dt*1.4));
    const A=AMB[world];
    if(A) for(const p of parts){
      if(A[0]==='rain'){
        p.y+=p.v*dt; if(p.y-p.len>H){p.y=-p.len; p.x=Math.random()*W;}
        ctx.globalAlpha=p.a*amb; ctx.strokeStyle='rgb(70,240,255)'; ctx.lineWidth=dpr;
        ctx.beginPath(); ctx.moveTo(p.x,p.y-p.len); ctx.lineTo(p.x,p.y); ctx.stroke();
      } else if(A[0]==='spark'){
        p.x-=p.v*2*dt; if(p.x<-p.len){p.x=W+p.len; p.y=Math.random()*H;}
        ctx.globalAlpha=p.a*amb; ctx.strokeStyle='rgb('+A[1]+')'; ctx.lineWidth=dpr*1.2;
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+p.len*.4,p.y); ctx.stroke();
      } else {                                                    // fly (drift) or ember (rise)
        p.y-=p.v*(A[0]==='ember'?.6:.15)*dt; p.x+=Math.sin(t*.0008+p.ph)*.3*dpr;
        if(p.y<-20){p.y=H+20; p.x=Math.random()*W;}
        ctx.globalAlpha=(.3+.7*Math.abs(Math.sin(t*(A[0]==='ember'?.004:.0011)+p.ph)))*amb;
        ctx.drawImage(spr(A[1]),p.x-p.r,p.y-p.r,p.r*2,p.r*2);
      }
    }
    ctx.globalAlpha=1;
  }
  function frame(t){
    raf=requestAnimationFrame(frame);
    if(t-last<33||lbOpen) return;
    const dt=Math.min((t-last)/1000,.1); last=t; draw(t,dt);
  }
  fit(); parts=spawn(world);
  let rw=innerWidth, rt=0;
  addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>{if(innerWidth===rw) return; rw=innerWidth; fit(); parts=spawn(world); if(!raf) draw(0,0);},200);});
  if(reduce) draw(0,0);
  else{
    raf=requestAnimationFrame(frame);
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){cancelAnimationFrame(raf); raf=0;}
      else if(!raf){last=performance.now(); raf=requestAnimationFrame(frame);}
    });
  }
})();

setUniverse(UNIVERSES[location.hash.slice(1)]?location.hash.slice(1):'novazone');
