<style>
/* ===================== BASE ===================== */
body{
    margin:0;
    font-family:Arial;
    color:white;
    background:url("background.webp") center/cover no-repeat fixed;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:-1;
}

/* ===================== HEADER ===================== */
.header{
    text-align:center;
    margin-top:30px;
}

.title{
    font-size:28px;
    color:#00ffcc;
    font-weight:bold;
}

.ai-box{
    margin:10px auto;
    max-width:700px;
    padding:10px;
    border:1px solid rgba(0,255,255,0.5);
    border-radius:10px;
    font-size:13px;
    color:#bff;
    text-align:center;
    background:rgba(0,0,0,0.3);
}

/* ===================== FILTER ===================== */
.filters{
    text-align:center;
    margin:20px;
}

.filters button{
    margin:5px;
    padding:6px 12px;
    border:1px solid #00ffcc;
    background:black;
    color:#00ffcc;
    cursor:pointer;
}

.filters button:hover{
    background:#00ffcc;
    color:black;
}

/* ===================== GRID ===================== */
.grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:12px;
    padding:15px;
}

@media (max-width:768px){
    .grid{
        grid-template-columns:repeat(2, 1fr);
    }
}

@media (max-width:480px){
    .grid{
        grid-template-columns:repeat(1, 1fr);
    }
}

/* ===================== CARD ===================== */
.card{
    position:relative;
    width:100%;
    height:230px;
    border-radius:12px;
    overflow:hidden;
    background:rgba(0,0,0,0.6);
    border:1px solid #00ffcc;
    cursor:pointer;
    transition:0.3s;
    aspect-ratio: 1/1.2;
}

/* hover effect */
.card:hover{
    transform:scale(1.05);
    z-index:10;
}

/* ===================== IMAGE ===================== */
.img-box{
    width:100%;
    height:140px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:rgba(0,0,0,0.25);
    border-radius:8px;
}

/* KEY FIX HERE */
.img-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

.image-prev,
.image-next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:30px;
    height:40px;
    border:none;
    background:rgba(0,0,0,0.65);
    color:#00ffcc;
    font-size:28px;
    cursor:pointer;
    z-index:5;
}

.image-prev{
    left:5px;
}

.image-next{
    right:5px;
}

.image-prev:hover,
.image-next:hover{
    background:#00ffcc;
    color:black;
}

.image-counter{
    position:absolute;
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.7);
    color:#00ffcc;
    padding:3px 8px;
    border-radius:10px;
    font-size:11px;
    z-index:5;
}
/* ===================== TEXT ===================== */
.card h3{
    margin:8px 0 0;
    font-size:14px;
    color:#00ffcc;
    text-align:center;
}

/* ===================== FLIP SYSTEM ===================== */
.front, .back{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    transition:0.6s;
    border-radius:12px;
    background:rgba(0,0,0,0.6);
}

/* FRONT */
.front{
    transform:rotateY(0deg);
}

/* BACK */
.back{
    transform:rotateY(180deg);
    padding:10px;
    color:#00ffcc;
    font-size:13px;
}

/* FLIP ACTIVE */
.card.flipped .front{
    transform:rotateY(180deg);
}

.card.flipped .back{
    transform:rotateY(0deg);
}

/* ===================== IMAGE HOLD ZOOM ===================== */
.inspect-view{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.inspect-view img{
    max-width:90%;
    max-height:90%;
    object-fit:contain;
    border:2px solid #00ffcc;
    border-radius:10px;
    box-shadow:0 0 20px #00ffcc;
}

.inspect-prev,
.inspect-next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:50px;
    height:60px;
    border:none;
    background:rgba(0,0,0,0.65);
    color:#00ffcc;
    font-size:40px;
    cursor:pointer;
    z-index:10000;
}

.inspect-prev{
    left:20px;
}

.inspect-next{
    right:20px;
}

.inspect-prev:hover,
.inspect-next:hover{
    background:#00ffcc;
    color:black;
}

.inspect-close{
    position:absolute;
    top:20px;
    right:25px;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,0.7);
    color:#00ffcc;
    font-size:30px;
    cursor:pointer;
    z-index:10001;
}

.inspect-close:hover{

    color:black;
}
/* ===================== BUTTON ===================== */

    background:cyan;
    color:black;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    z-index:20;
}

</style>

/* 🔥 SINGLE RENDER ONLY */
function render(data){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    data.forEach((item, index) => {

        const images = item.images || [item.img];

        grid.innerHTML += `
        <div class="card">

            <div class="front">

                <div class="img-box">

                    <img
                        id="img-${index}"
                        src="${images[0]}"
                    >

                    ${
                        images.length > 1
                        ? `
                        <button
                            class="image-prev"
                            onclick="event.stopPropagation(); changeImage(${index}, -1)"
                        >‹</button>

                        <button
                            class="image-next"
                            onclick="event.stopPropagation(); changeImage(${index}, 1)"
                        >›</button>

                        <div class="image-counter" id="counter-${index}">
                            1 / ${images.length}
                        </div>
                        `
                        : ""
                    }

                </div>

                <h3>${item.name}</h3>

            </div>

            <div class="back">

                <p>${item.role ? "Role: " + item.role : ""}</p>

                <p>${item.power ? "Power: " + item.power : ""}</p>

                <p>Zone: ${item.zone}</p>

            </div>

        </div>
        `;

        window[`images_${index}`] = images;
        window[`currentImage_${index}`] = 0;
    });
}



/* 🔥 FILTERS */

function changeImage(index, direction){

    const images = window[`images_${index}`];

    if(!images || images.length <= 1){
        return;
    }

    let current = window[`currentImage_${index}`];

    current += direction;

    if(current < 0){
        current = images.length - 1;
    }

    if(current >= images.length){
        current = 0;
    }

    window[`currentImage_${index}`] = current;

    document.getElementById(`img-${index}`).src = images[current];

    document.getElementById(`counter-${index}`).textContent =
        `${current + 1} / ${images.length}`;
}



/* ===================== CARD / ZOOM SYSTEM ===================== */

let inspectImages = [];
let inspectCurrent = 0;

let clickTimer = null;
let mobileHoldTimer = null;
let mobileHolding = false;


/* ===================== OPEN ZOOM ===================== */

function openZoom(img){

    const card = img.closest(".card");

    if(!card){
        return;
    }

    const cards = Array.from(document.querySelectorAll(".card"));
    const index = cards.indexOf(card);

    const images = window[`images_${index}`];

    if(images && images.length > 0){

        inspectImages = images;

        inspectCurrent =
            window[`currentImage_${index}`] || 0;

    }
    else{

        inspectImages = [img.src];

        inspectCurrent = 0;

    }

    document.getElementById("inspectImg").src =
        inspectImages[inspectCurrent];


    /* SHOW ARROWS ONLY FOR MULTIPLE IMAGES */

    const prevBtn =
        document.getElementById("inspectPrev");

    const nextBtn =
        document.getElementById("inspectNext");

    if(inspectImages.length > 1){

        prevBtn.style.display = "block";
        nextBtn.style.display = "block";

    }
    else{

        prevBtn.style.display = "none";
        nextBtn.style.display = "none";

    }


    document.getElementById("inspectView").style.display =
        "flex";

}


/* =========================================================
   DESKTOP
   SINGLE CLICK  = ABOUT
   SECOND CLICK  = IMAGE
   DOUBLE CLICK  = ZOOM
   ========================================================= */

document.addEventListener("click", function(e){

    const card = e.target.closest(".card");

    if(!card){
        return;
    }

    /* Ignore image navigation buttons */
    if(
        e.target.classList.contains("image-prev") ||
        e.target.classList.contains("image-next")
    ){
        return;
    }

    clearTimeout(clickTimer);

    clickTimer = setTimeout(function(){

        card.classList.toggle("flipped");

    }, 250);

});


document.addEventListener("dblclick", function(e){

    if(e.target.tagName !== "IMG"){
        return;
    }

    clearTimeout(clickTimer);

    e.preventDefault();
    e.stopPropagation();

    openZoom(e.target);

});

/* ===================== MOBILE CARD CONTROL ===================== */

let mobileTouchStarted = false;

document.addEventListener("touchstart", function(e){

    if(e.target.tagName !== "IMG"){
        return;
    }

    mobileTouchStarted = true;
    mobileHolding = false;

    const img = e.target;

    clearTimeout(mobileHoldTimer);

    mobileHoldTimer = setTimeout(function(){

        mobileHolding = true;

        openZoom(img);

    }, 600);

}, {passive:true});


document.addEventListener("touchend", function(e){

    if(!mobileTouchStarted){
        return;
    }

    clearTimeout(mobileHoldTimer);

    const img = e.target.closest("img");

    if(img && !mobileHolding){

        const card = img.closest(".card");

        if(card){

            flipCard(card);

        }

    }

    mobileTouchStarted = false;
    mobileHolding = false;

}, {passive:true});


document.addEventListener("touchcancel", function(){

    clearTimeout(mobileHoldTimer);

    mobileTouchStarted = false;
    mobileHolding = false;

});

/* =========================================================
   ZOOM IMAGE SWITCH
   ========================================================= */

function changeInspectImage(direction){

    if(inspectImages.length <= 1){
        return;
    }

    inspectCurrent += direction;

    if(inspectCurrent < 0){

        inspectCurrent =
            inspectImages.length - 1;

    }

    if(inspectCurrent >= inspectImages.length){

        inspectCurrent = 0;

    }

    document.getElementById("inspectImg").src =
        inspectImages[inspectCurrent];

}


/* =========================================================
   CLOSE ZOOM
   ========================================================= */

function closeInspect(){

    document.getElementById("inspectView").style.display =
        "none";

    inspectImages = [];

    inspectCurrent = 0;

}
